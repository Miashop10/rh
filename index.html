/* ==================================================================
   ABA FOLHA DE PAGAMENTO
   VT e VR vêm do grupo de valores da filial (lojas de rua, shopping,
   cada cidade). O total é o valor diário vezes os dias trabalhados.
   ================================================================== */
function grupoDaFilial(nomeFilial){
  const fil = S.filiais.find(x=>x.nome===nomeFilial);
  if(!fil || !fil.grupo) return null;
  return S.grupos.find(g=>g.nome===fil.grupo) || null;
}

function linhaFolhaDe(f){
  const l = S.folha.linhas[f.id] || {};
  const g = grupoDaFilial(f.filial);
  const vt = l.vtDiario !== undefined && l.vtDiario !== '' ? l.vtDiario : (g ? g.vtDiario : '');
  const vr = l.vrDiario !== undefined && l.vrDiario !== '' ? l.vrDiario : (g ? g.vrDiario : '');
  const dias = l.dias || '';
  return {
    grupo: g ? g.nome : '', vtDiario: vt, vrDiario: vr, dias,
    vale: l.vale || '', observacoes: l.observacoes || '',
    totalVt: valorNum(vt) * valorNum(dias),
    totalVr: valorNum(vr) * valorNum(dias)
  };
}

function funcionariosDaFolha(){
  return S.funcionarios
    .filter(f=>f.status!=='DEMITIDO')
    .filter(f=> S.filtroFilial==='TODAS' || f.filial===S.filtroFilial)
    .filter(f=> !S.busca.trim() || f.nome.toUpperCase().includes(S.busca.trim().toUpperCase()))
    .sort((a,b)=> (a.filial||'').localeCompare(b.filial||'','pt-BR',{numeric:true})
                  || a.nome.localeCompare(b.nome,'pt-BR'));
}

  </div>
  <div class="aviso info">
    Folha de <b>${compBonita(S.competencia)}</b> · ${lista.length} funcionários ativos.

async function carregarFolha(){
  carregando(true);
  try{
    const linhas = await api('listarFolha', {competencia:S.competencia});
    S.folha.linhas = {};
    linhas.forEach(l=>{ S.folha.linhas[l.funcionarioId] = l; });
    S.folha.competencia = S.competencia;
    desenhar();
  }catch(e){ toast(e.message, true); }
  finally{ carregando(false); }
}

function ligarFolha(){
  document.querySelectorAll('.cel-folha').forEach(c=>{
    c.oninput = ()=>{
      const l = S.folha.linhas[c.dataset.f] || (S.folha.linhas[c.dataset.f] = {funcionarioId:c.dataset.f});
      l[c.dataset.campo] = c.value;
      if(c.dataset.campo!=='observacoes') atualizarTotaisFolha();
    };
    c.onblur = ()=>{ if(c.classList.contains('dinheiro') && c.value.trim()){
      c.value = moeda(valorNum(c.value));
      S.folha.linhas[c.dataset.f][c.dataset.campo] = c.value;
      atualizarTotaisFolha();
    }};
  });

  const b = id => document.getElementById(id);
  if(b('folhaDias')) b('folhaDias').oninput = e=>{ S.folha.diasPadrao = e.target.value; };
  if(b('folhaAplicar')) b('folhaAplicar').onclick = ()=>{
    const d = String(S.folha.diasPadrao||'').trim();
    if(!d) return toast('Digite a quantidade de dias antes de aplicar.', true);
    funcionariosDaFolha().forEach(f=>{
      const l = S.folha.linhas[f.id] || (S.folha.linhas[f.id] = {funcionarioId:f.id});
      l.dias = d;
    });
    desenhar();
    toast(d+' dias aplicados a todos os funcionários da lista.');
  };
  document.querySelectorAll('[data-vale]').forEach(sel=> sel.onchange = async ()=>{
    const f = S.funcionarios.find(x=>x.id===sel.dataset.vale);
    carregando(true);
    try{
      await api('definirRecebeVale', {funcionarioId:f.id, recebe:sel.value});
      f.recebeVale = sel.value;
      if(sel.value==='NAO'){
        const l = S.folha.linhas[f.id];
        if(l) l.vale = '';
      }
      desenhar();
      toast(f.nome+(sel.value==='NAO'
        ? ' não recebe vale — vale para os próximos meses também.'
        : ' volta a receber vale.'));
    }catch(e){ toast(e.message, true); sel.value = f.recebeVale||'SIM'; }
    finally{ carregando(false); }
  });

  if(b('folhaSalvar')) b('folhaSalvar').onclick = salvarFolha;
  if(b('folhaExcel')) b('folhaExcel').onclick = exportarFolhaExcel;
  if(b('folhaPdf')) b('folhaPdf').onclick = exportarFolhaPdf;

  /* grupos de valores: grava ao sair do campo */
  document.querySelectorAll('[data-g]').forEach(campo=>{
    campo.dataset.antes = campo.value;
    campo.onchange = async ()=>{
      const tr = campo.closest('tr');
      const v = nome => tr.querySelector(`[data-g="${nome}"]`).value;
      const grupo = {id: tr.dataset.novo ? '' : tr.dataset.gId,
                     nome: v('nome').trim(), vtDiario: v('vtDiario'), vrDiario: v('vrDiario')};
      if(!grupo.nome){
        if(tr.dataset.novo) return;              /* linha em branco do fim */
        campo.value = campo.dataset.antes;
        return toast('O grupo precisa de um nome.', true);
      }
      if(campo.dataset.g!=='nome' && campo.value.trim()) campo.value = moeda(valorNum(campo.value));
      carregando(true);
      try{ await api('salvarGrupo', {grupo}); await recarregar(); toast('Valores salvos.'); }
      catch(e){ toast(e.message, true); campo.value = campo.dataset.antes; }
      finally{ carregando(false); }
    };
  });
  document.querySelectorAll('[data-g-excluir]').forEach(x=> x.onclick = async ()=>{
    const tr = x.closest('tr');
    if(!confirm('Excluir o grupo '+tr.querySelector('[data-g="nome"]').value+'?')) return;
    carregando(true);
    try{ await api('excluirGrupo', {id:tr.dataset.gId}); await recarregar(); toast('Grupo excluído.'); }
    catch(e){ toast(e.message, true); }
    finally{ carregando(false); }
  });
  document.querySelectorAll('[data-filialGrupo], [data-filial-grupo]').forEach(sel=>
    sel.onchange = async ()=>{
      const fil = S.filiais.find(f=>f.id===sel.dataset.filialGrupo);
      carregando(true);
      try{
        await api('salvarFilial', {id:fil.id, nome:fil.nome, cnpj:fil.cnpj||'', grupo:sel.value});
        await recarregar();
        toast(fil.nome+' → '+(sel.value||'sem grupo'));
      }catch(e){ toast(e.message, true); }
      finally{ carregando(false); }
    });
}

function atualizarTotaisFolha(){
  /* redesenha só os totais, para não perder o foco do campo em edição */
  const lista = funcionariosDaFolha();
  const linhas = document.querySelectorAll('.tab-folha tbody tr');
  lista.forEach((f,i)=>{
    const d = linhaFolhaDe(f);
    const tds = linhas[i] && linhas[i].querySelectorAll('.t-total');
    if(tds && tds.length===2){ tds[0].textContent = moeda(d.totalVt); tds[1].textContent = moeda(d.totalVr); }
  });
  const pe = document.querySelectorAll('.tab-folha tfoot b');
  if(pe.length===4){
    pe[0].textContent = lista.reduce((s,f)=>s+valorNum(linhaFolhaDe(f).dias),0);
    pe[1].textContent = moeda(lista.reduce((s,f)=>s+linhaFolhaDe(f).totalVt,0));
    pe[2].textContent = moeda(lista.reduce((s,f)=>s+linhaFolhaDe(f).totalVr,0));
    pe[3].textContent = moeda(lista.reduce((s,f)=>s+valorNum(linhaFolhaDe(f).vale),0));
  }
}

async function salvarFolha(){
  const lista = funcionariosDaFolha();
  const itens = lista.map(f=>{
    const d = linhaFolhaDe(f);
    return {
      funcionarioId:f.id, nome:f.nome, filial:f.filial, grupo:d.grupo,
      vtDiario:d.vtDiario, dias:d.dias, totalVt:moeda(d.totalVt),
      vrDiario:d.vrDiario, totalVr:moeda(d.totalVr),
      vale: f.recebeVale==='NAO' ? 'NÃO RECEBE' : d.vale, observacoes:d.observacoes
    };
  }).filter(it=> it.dias || it.vale || it.observacoes);
  if(!itens.length) return toast('Preencha ao menos os dias de alguém antes de salvar.', true);
  carregando(true);
  try{
    const r = await api('salvarFolha', {competencia:S.competencia, itens});
    toast(r.salvos+' lançamentos salvos em '+compBonita(S.competencia)+'.');
  }catch(e){ toast(e.message, true); }
  finally{ carregando(false); }
}

function tabelaFolha(){
  const lista = funcionariosDaFolha();
  const cab = ['FUNCIONÁRIO','FILIAL','GRUPO','VT/DIA','DIAS','TOTAL VT','VR/DIA','TOTAL VR','VALE MENSAL','QUER VALE','OBSERVAÇÕES'];
  const linhas = lista.map(f=>{
    const d = linhaFolhaDe(f);
    return [f.nome, f.filial, d.grupo, d.vtDiario, d.dias, moeda(d.totalVt),
            d.vrDiario, moeda(d.totalVr),
            f.recebeVale==='NAO' ? '' : d.vale,
            f.recebeVale==='NAO' ? 'NÃO' : 'SIM', d.observacoes];
  });
  const total = ['TOTAL','','','', String(lista.reduce((s,f)=>s+valorNum(linhaFolhaDe(f).dias),0)),
    moeda(lista.reduce((s,f)=>s+linhaFolhaDe(f).totalVt,0)), '',
    moeda(lista.reduce((s,f)=>s+linhaFolhaDe(f).totalVr,0)),
    moeda(lista.reduce((s,f)=> s + (f.recebeVale==='NAO'?0:valorNum(linhaFolhaDe(f).vale)),0)), '', ''];
  return {cab, linhas, total};
}

async function exportarFolhaExcel(){
  await usar('xlsx');
  const {cab, linhas, total} = tabelaFolha();
  const ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas).concat([total]));
  ws['!cols'] = [{wch:36},{wch:18},{wch:24},{wch:12},{wch:8},{wch:14},{wch:12},{wch:14},{wch:14},{wch:11},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'FOLHA');
  XLSX.writeFile(wb, 'FOLHA DE PAGAMENTO '+compArquivo(S.competencia)+'.xlsx');
  toast('Planilha gerada.');
}

async function exportarFolhaPdf(){
  carregando(true);
  try{
    await usar('pdflib');
    const {PDFDocument, StandardFonts, rgb} = PDFLib;
    const doc = await PDFDocument.create();
    const fonte = await doc.embedFont(StandardFonts.Helvetica);
    const fonteB = await doc.embedFont(StandardFonts.HelveticaBold);
    const logo = await doc.embedPng(b64Bytes(LOGO_ESCURA));
    const {cab, linhas, total} = tabelaFolha();
    const L=841.89, A=595.28, m=30;
    const larg = [176, 88, 96, 54, 34, 62, 54, 62, 62];
    const xs = []; let acc = m;
    larg.forEach(w=>{ xs.push(acc); acc += w; });
    const corta = (t,max)=>{ t=String(t||''); return t.length>max?t.slice(0,max-1)+'…':t; };

    let pg, y;
    const cabecalho = ()=>{
      pg = doc.addPage([L,A]); y = A-38;
      const h=15; pg.drawImage(logo,{x:m, y, width:logo.width*h/logo.height, height:h});
      pg.drawText('Folha de pagamento · '+compBonita(S.competencia),
        {x:m, y:y-22, size:12, font:fonteB, color:rgb(.06,.07,.08)});
      y -= 44;
      cab.slice(0,larg.length).forEach((t,i)=>
        pg.drawText(corta(t,14),{x:xs[i], y, size:6.5, font:fonteB, color:rgb(.42,.45,.5)}));
      y -= 6;
      pg.drawLine({start:{x:m,y}, end:{x:L-m,y}, thickness:.7, color:rgb(.8,.83,.86)});
      y -= 12;
    };
    cabecalho();
    linhas.forEach(l=>{
      if(y < m+26) cabecalho();
      l.slice(0,larg.length).forEach((t,i)=>
        pg.drawText(corta(t, i===0?32:i===2?17:11),{x:xs[i], y, size:7.5,
          font: (i===5||i===7)?fonteB:fonte, color:rgb(.06,.07,.08)}));
      y -= 7;
      pg.drawLine({start:{x:m,y}, end:{x:L-m,y}, thickness:.4, color:rgb(.93,.94,.95)});
      y -= 11;
    });
    if(y < m+26) cabecalho();
    y -= 3;
    total.slice(0,larg.length).forEach((t,i)=>{
      if(t) pg.drawText(corta(t,12),{x:xs[i], y, size:8, font:fonteB});
    });
    baixar(new Blob([await doc.save()],{type:'application/pdf'}),
      'FOLHA DE PAGAMENTO '+compArquivo(S.competencia)+'.pdf');
    toast('Relatório gerado.');
  }catch(e){ toast(e.message,true); }
  finally{ carregando(false); }
}

/* ==================================================================
   ABA CONTABILIDADE
   Uma linha por funcionário ativo na competência. As colunas de horas
   extras, adicional noturno, faltas e atrasos vêm da aba Horas extras
   (do que está na tela ou do que já foi salvo); o resto é digitado.
   ================================================================== */
const COLS_CONT = [
  {campo:'vale',       titulo:'VALE',              tipo:'dinheiro'},
  {campo:'he50',       titulo:'H. EXTRAS 50%',     tipo:'hora',    puxa:true},
  {campo:'he100',      titulo:'H. EXTRAS 100%',    tipo:'hora',    puxa:true},
  {campo:'adNoturno',  titulo:'AD. NOTURNO',       tipo:'hora',    puxa:true},
  {campo:'faltas',     titulo:'FALTAS',            tipo:'numero',  puxa:true},
  {campo:'atrasos',    titulo:'ATRASOS',           tipo:'hora',    puxa:true},
  {campo:'comissoes',  titulo:'COMISSÕES',         tipo:'dinheiro',puxa:true},
  {campo:'vrAnterior', titulo:'VR MÊS ANTERIOR',   tipo:'dinheiro'},
  {campo:'vrAtual',    titulo:'VR MÊS ATUAL',      tipo:'dinheiro'},
  {campo:'vt',         titulo:'VT',                tipo:'dinheiro'},
  {campo:'quebra',     titulo:'QUEBRA DE PRODUTOS',tipo:'dinheiro'},
  {campo:'premiacao',  titulo:'PREMIAÇÃO',         tipo:'dinheiro'}
];

function valorNum(v){
  const t = String(v==null?'':v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}
function moeda(n){
  return n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function somaHoras(lista){
  return minParaHora(lista.reduce((s,t)=>{
    const m = String(t||'').match(/^(-?)(\d{1,3}):(\d{2})$/);
    return s + (m ? (m[1]==='-'?-1:1)*(+m[2]*60 + +m[3]) : 0);
  }, 0));
}

/* de onde vem cada valor automático */
function apuracaoDe(f){
  const vivo = S.he.resultados.find(r=>
    (r.funcionarioId && r.funcionarioId===f.id) || normalizar(r.nome)===normalizar(f.nome));
  if(vivo) return Object.assign({
    he50: minParaHora(vivo.ap.he50), he100: minParaHora(vivo.ap.he100),
    adNoturno: minParaHora(vivo.ap.noturno), faltas: String(vivo.ap.diasFalta),
    atrasos: minParaHora(vivo.ap.atrasos), origem:'tela'
  }, comissaoDe(f));
  const salva = (S.cont.apuracoes||[]).find(a=>
    (a.funcionarioId && a.funcionarioId===f.id) || normalizar(a.nome)===normalizar(f.nome));
  if(salva) return Object.assign({
    he50: salva.he50, he100: salva.he100, adNoturno: salva.adicionalNoturno,
    faltas: '', atrasos: salva.atrasos, origem:'salva'
  }, comissaoDe(f));
  const so = comissaoDe(f);
  return so ? Object.assign({he50:'',he100:'',adNoturno:'',faltas:'',atrasos:'',origem:'comissao'}, so) : null;
}

/* total das metas batidas no mês, vindo da aba Comissões */
function comissaoDe(f){
  const dias = (S.cont.comissoes||[]).filter(d=>d.funcionarioId===f.id);
  if(!dias.length) return null;
  return {comissoes: moeda(dias.reduce((s,d)=>s+valorNum(d.valor),0))};
}

function linhasContabilidade(){
  return S.funcionarios
    .filter(f=>f.status!=='DEMITIDO')
    .filter(f=> S.filtroFilial==='TODAS' || f.filial===S.filtroFilial)
    .filter(f=> !S.busca.trim() || f.nome.toUpperCase().includes(S.busca.trim().toUpperCase()))
    .sort((a,b)=> (a.filial||'').localeCompare(b.filial||'','pt-BR') || a.nome.localeCompare(b.nome,'pt-BR'));
}

  if(!lista.length) return html + vazio('Nenhum funcionário ativo','Ajuste a busca ou o filtro de filial.');

  html += `<div class="painel" style="padding:0">
    <div class="previa" style="max-height:none;border:none">
    <table class="tab-cont"><thead><tr>
      <th class="col-fixa">Funcionário</th><th>Filial</th>
      ${COLS_CONT.map(c=>`<th class="${c.puxa?'col-auto':''}">${esc(c.titulo)}</th>`).join('')}
      <th style="min-width:170px">Observações</th>
    </tr></thead><tbody>`;

  lista.forEach(f=>{
    const l = S.cont.linhas[f.id] || {};
    const ap = apuracaoDe(f);
    html += `<tr>
      <td class="col-fixa"><b>${esc(f.nome)}</b></td>
      <td style="color:var(--apagado)">${esc(f.filial)}</td>
      ${COLS_CONT.map(c=>`<td class="${c.puxa?'col-auto':''}">
        <input class="entrada cel-cont ${c.tipo}" data-f="${f.id}" data-campo="${c.campo}"
               value="${esc(l[c.campo]||'')}"
               placeholder="${c.puxa && ap && ap[c.campo] ? esc(ap[c.campo]) : ''}"
               title="${c.puxa && ap ? 'Da apuração: '+esc(ap[c.campo]||'—') : ''}"></td>`).join('')}
      <td><input class="entrada cel-cont" data-f="${f.id}" data-campo="observacoes"
                 value="${esc(l.observacoes||'')}" placeholder="Anotação"></td>
    </tr>`;
  });

  const soma = campo => lista.map(f=>(S.cont.linhas[f.id]||{})[campo]);
  html += `</tbody><tfoot><tr>
      <td class="col-fixa"><b>TOTAL</b></td><td></td>
      ${COLS_CONT.map(c=>`<td class="mono ${c.puxa?'col-auto':''}"><b>${
        c.tipo==='hora' ? somaHoras(soma(c.campo))
        : c.tipo==='numero' ? String(soma(c.campo).reduce((s,v)=>s+valorNum(v),0))
        : moeda(soma(c.campo).reduce((s,v)=>s+valorNum(v),0))
      }</b></td>`).join('')}
      <td></td>
    </tr></tfoot></table></div></div>`;
  return html;
}

async function carregarContabilidade(){
  carregando(true);
  try{
    const d = await api('listarContabilidade', {competencia:S.competencia});
    S.cont.linhas = {};
    d.linhas.forEach(l=>{ S.cont.linhas[l.funcionarioId] = l; });
    S.cont.apuracoes = d.apuracoes;
    S.cont.comissoes = d.comissoes || [];
    S.cont.competencia = S.competencia;
    desenhar();
  }catch(e){ toast(e.message, true); }
  finally{ carregando(false); }
}

function ligarContabilidade(){
  document.querySelectorAll('.cel-cont').forEach(c=>{
    c.oninput = ()=>{
      const l = S.cont.linhas[c.dataset.f] || (S.cont.linhas[c.dataset.f] = {funcionarioId:c.dataset.f});
      l[c.dataset.campo] = c.value;
    };
    c.onblur = ()=>{ if(c.classList.contains('dinheiro') && c.value.trim()){
      c.value = moeda(valorNum(c.value));
      S.cont.linhas[c.dataset.f][c.dataset.campo] = c.value;
      desenhar();
    }};
  });
  const b = id => document.getElementById(id);
  if(b('contPuxar')) b('contPuxar').onclick = puxarHorasExtras;
  if(b('contSalvar')) b('contSalvar').onclick = salvarContabilidade;
  if(b('contExcel')) b('contExcel').onclick = exportarContExcel;
  if(b('contPdf')) b('contPdf').onclick = exportarContPdf;
}

function puxarHorasExtras(){
  let n = 0;
  linhasContabilidade().forEach(f=>{
    const ap = apuracaoDe(f);
    if(!ap) return;
    const l = S.cont.linhas[f.id] || (S.cont.linhas[f.id] = {funcionarioId:f.id});
    COLS_CONT.filter(c=>c.puxa).forEach(c=>{ if(ap[c.campo]) l[c.campo] = ap[c.campo]; });
    n++;
  });
  desenhar();
  toast(n ? n+' funcionário(s) preenchido(s) pela apuração.'
          : 'Nenhuma apuração encontrada para esta competência.', !n);
}

async function salvarContabilidade(){
  const lista = linhasContabilidade();
  const itens = lista.map(f=>{
    const l = S.cont.linhas[f.id] || {};
    return Object.assign({funcionarioId:f.id, nome:f.nome, filial:f.filial},
      Object.fromEntries(COLS_CONT.map(c=>[c.campo, l[c.campo]||''])),
      {observacoes: l.observacoes||''});
  }).filter(it=> COLS_CONT.some(c=>it[c.campo]) || it.observacoes);

  if(!itens.length) return toast('Não há nada preenchido para salvar.', true);
  carregando(true);
  try{
    const r = await api('salvarContabilidade', {competencia:S.competencia, itens});
    toast(r.salvos+' lançamentos salvos em '+compBonita(S.competencia)+'.');
  }catch(e){ toast(e.message, true); }
  finally{ carregando(false); }
}

function tabelaCont(){
  const lista = linhasContabilidade();
  const cab = ['FUNCIONÁRIO','FILIAL'].concat(COLS_CONT.map(c=>c.titulo)).concat(['OBSERVAÇÕES']);
  const linhas = lista.map(f=>{
    const l = S.cont.linhas[f.id] || {};
    return [f.nome, f.filial].concat(COLS_CONT.map(c=>l[c.campo]||'')).concat([l.observacoes||'']);
  });
  const total = ['TOTAL',''].concat(COLS_CONT.map(c=>{
    const vals = lista.map(f=>(S.cont.linhas[f.id]||{})[c.campo]);
    return c.tipo==='hora' ? somaHoras(vals)
         : c.tipo==='numero' ? String(vals.reduce((s,v)=>s+valorNum(v),0))
         : moeda(vals.reduce((s,v)=>s+valorNum(v),0));
  })).concat(['']);
  return {cab, linhas, total};
}

async function exportarContExcel(){
  await usar('xlsx');
  const {cab, linhas, total} = tabelaCont();
  const ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas).concat([total]));
  ws['!cols'] = [{wch:36},{wch:16}].concat(COLS_CONT.map(()=>({wch:16}))).concat([{wch:34}]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'CONTABILIDADE');
  XLSX.writeFile(wb, 'CONTABILIDADE '+compArquivo(S.competencia)+'.xlsx');
  toast('Planilha gerada.');
}

async function exportarContPdf(){
  carregando(true);
  try{
    await usar('pdflib');
    const {PDFDocument, StandardFonts, rgb} = PDFLib;
    const doc = await PDFDocument.create();
    const fonte = await doc.embedFont(StandardFonts.Helvetica);
    const fonteB = await doc.embedFont(StandardFonts.HelveticaBold);
    const logo = await doc.embedPng(b64Bytes(LOGO_ESCURA));
    const {cab, linhas, total} = tabelaCont();
    const L=841.89, A=595.28, m=26;
    const larguras = [128, 60].concat(COLS_CONT.map(()=>58));
    const xs = []; let acc = m;
    larguras.forEach(w=>{ xs.push(acc); acc += w; });

    let pg, y;
    const corta = (t,max)=>{ t=String(t||''); return t.length>max?t.slice(0,max-1)+'…':t; };
    const cabecalho = ()=>{
      pg = doc.addPage([L,A]); y = A-38;
      const h=15; pg.drawImage(logo,{x:m, y, width:logo.width*h/logo.height, height:h});
      pg.drawText('Contabilidade · '+compBonita(S.competencia),
        {x:m, y:y-22, size:12, font:fonteB, color:rgb(.06,.07,.08)});
      y -= 44;
      cab.slice(0, larguras.length).forEach((t,i)=>
        pg.drawText(corta(t,13),{x:xs[i], y, size:6, font:fonteB, color:rgb(.42,.45,.5)}));
      y -= 6;
      pg.drawLine({start:{x:m,y}, end:{x:L-m,y}, thickness:.7, color:rgb(.8,.83,.86)});
      y -= 12;
    };
    cabecalho();
    linhas.forEach(l=>{
      if(y < m+26) cabecalho();
      l.slice(0, larguras.length).forEach((t,i)=>
        pg.drawText(corta(t, i===0?26:11),{x:xs[i], y, size:7.5, font:fonte, color:rgb(.06,.07,.08)}));
      y -= 7;
      pg.drawLine({start:{x:m,y}, end:{x:L-m,y}, thickness:.4, color:rgb(.93,.94,.95)});
      y -= 11;
    });
    if(y < m+26) cabecalho();
    y -= 3;
    total.slice(0, larguras.length).forEach((t,i)=>
      pg.drawText(corta(t,12),{x:xs[i], y, size:8, font:fonteB}));
    baixar(new Blob([await doc.save()],{type:'application/pdf'}),
      'CONTABILIDADE '+compArquivo(S.competencia)+'.pdf');
    toast('Relatório gerado.');
  }catch(e){ toast(e.message,true); }
  finally{ carregando(false); }
}

    .filter(f=> !S.busca.trim() || f.nome.toUpperCase().includes(S.busca.trim().toUpperCase()))

    .concat(S.filiais.map(f=>`<option value="${esc(f.nome)}" ${S.filtroFilial===f.nome?'selected':''}>${esc(f.nome)}</option>`));

  let html = `

  </div>
  <div class="aviso info">
    Anexe os documentos de <b>${compBonita(S.competencia)}</b> até <b>${dataBonita(prazoDaCompetencia())}</b>.
    Para trocar o mês, use o campo Competência no alto da tela.
    ${S.sessao.papel==='GERENTE'&&S.sessao.filial?` Você anexa os documentos da filial <b>${esc(S.sessao.filial)}</b>.`:''}
  </div>`;

  if(!ativos.length){
    html += vazio('Nenhum funcionário nesta filial',
      'Fale com o RH para incluir os funcionários da sua loja no sistema.');
  }else{
    const faltando = ativos.filter(f=>situacao(f)==='vermelho').length;
    html += `
    <section class="filial">
      <div class="filial-topo">

function linhaAnexo(f, tipos){
  const cor = situacao(f);
  const meus = docsDe(f.id, S.competencia);
  const anexados = tipos.filter(t=>meus.find(d=>d.tipo===t)).length;
  const pills = tipos.map(t=>{
    const d = meus.find(x=>x.tipo===t);
    const estado = !d ? 'falta' : d.status==='APROVADO' ? 'aprovado' : 'anexado';
    return `<span class="pill ${estado}">${esc(t)}</span>`;
  }).join('')
  /* opcionais só aparecem depois de anexados, e nunca em vermelho */
  + meus.filter(d=>!tipos.includes(d.tipo))
        .map(d=>`<span class="pill opcional">${esc(d.tipo)}</span>`).join('');
  return `
  <div class="linha-anexo" data-docs="${f.id}">
    <div class="marcador m-${cor}"></div>
    <div>
      <div class="nome c-${cor}" style="padding:0">${esc(f.nome)}</div>
      <div class="pills">${pills}</div>
    </div>
    <div class="cel mono esconde-mob" style="text-align:right">${anexados}/${tipos.length}</div>
    <div class="acoes"><button class="btn sec mini" tabindex="-1">Anexar</button></div>
  </div>`;
}

          </div>

function ligarAnexar(){
  document.querySelectorAll('.linha-anexo').forEach(l=>
    l.onclick = ()=>abrirDocumentos(l.dataset.docs));

  const b = id => document.getElementById(id);
  const adicionar = grupo => {
    lerTiposDaTela();
    S.tiposEdit[grupo].push('');
    desenhar();
    const campos = document.querySelectorAll('[data-'+grupo+']');
    if(campos.length) campos[campos.length-1].focus();
  };
  if(b('obAdicionar')) b('obAdicionar').onclick = ()=>adicionar('ob');
  if(b('opAdicionar')) b('opAdicionar').onclick = ()=>adicionar('op');
  if(b('tipoDesfazer')) b('tipoDesfazer').onclick = ()=>{
    S.tiposEdit = null; desenhar(); toast('Listas restauradas.');
  };
  if(b('tipoSalvar')) b('tipoSalvar').onclick = salvarTipos;
  document.querySelectorAll('[data-remover]').forEach(x=> x.onclick = ()=>{
    const [grupo, i] = x.dataset.remover.split(':');
    lerTiposDaTela();
    S.tiposEdit[grupo].splice(+i, 1);
    desenhar();
  });
}

function camposDe(grupo){ return [...document.querySelectorAll('[data-'+grupo+']')]; }

function lerTiposDaTela(){
  if(!document.getElementById('listaOb')) return;
  S.tiposEdit = {
    ob: camposDe('ob').map(c=>c.value),
    op: camposDe('op').map(c=>c.value)
  };
}

async function salvarTipos(){
  const limpa = g => camposDe(g).map(c=>c.value.toUpperCase().trim()).filter(Boolean);
  const tipos = limpa('ob');
  const opcionais = limpa('op');
  if(!tipos.length) return toast('Deixe pelo menos um documento obrigatório.', true);

  const repetido = opcionais.find(t=>tipos.includes(t));
  if(repetido) return toast('"'+repetido+'" está nas duas listas. Deixe em uma só.', true);

  const renomear = [...camposDe('ob'), ...camposDe('op')]
    .map(c=>({de:c.dataset.original.toUpperCase().trim(), para:c.value.toUpperCase().trim()}))
    .filter(r=> r.de && r.para && r.de!==r.para);

  if(renomear.length){
    const lista = renomear.map(r=>r.de+' → '+r.para).join('\n');
    if(!confirm('Renomear e ajustar os arquivos já anexados?\n\n'+lista)) return;
  }
  carregando(true);
  try{
    const r = await api('salvarTipos', {tipos, opcionais, renomear});
    S.tiposEdit = null;
    await recarregar();
    toast('Listas salvas' + (r.renomeados ? ' · '+r.renomeados+' arquivos renomeados' : '') + '.');
  }catch(e){ toast(e.message,true); }
  finally{ carregando(false); }
}

/* ==================================================================
   IMPORTAÇÃO DE PLANILHA
   Colunas aceitas: NOME, FILIAL, CARGO, DATA ADMISSÃO, STATUS,
   OBSERVAÇÕES (e, opcionalmente, DATA DEMISSÃO).
   ================================================================== */
const COLUNAS = [
  {campo:'nome',         nomes:['NOME','NOME COMPLETO','FUNCIONARIO','FUNCIONÁRIO','COLABORADOR']},
  {campo:'filial',       nomes:['FILIAL','LOJA','UNIDADE']},
  {campo:'cargo',        nomes:['CARGO','FUNCAO','FUNÇÃO']},
  {campo:'dataAdmissao', nomes:['ADMISSAO','ADMISSÃO','DATA ADMISSAO','DATA DE ADMISSAO','DATA ADMISSÃO','DATA DE ADMISSÃO']},
  {campo:'dataInicio',   nomes:['INICIO','INÍCIO','DATA INICIO','DATA INÍCIO','DATA DE INICIO','DATA DE INÍCIO']},
  {campo:'dataDemissao', nomes:['DATA DEMISSAO','DATA DE DEMISSAO','DEMISSAO','DATA DEMISSÃO','DATA DE DEMISSÃO','DEMISSÃO']},
  {campo:'status',       nomes:['STATUS','SITUACAO','SITUAÇÃO']},
  {campo:'cpf',          nomes:['CPF']},
  {campo:'banco',        nomes:['BANCO']},
  {campo:'agencia',      nomes:['AGENCIA','AGÊNCIA','AG']},
  {campo:'conta',        nomes:['CONTA','CONTA CORRENTE','CC']},
  {campo:'tipoConta',    nomes:['TIPO CONTA','TIPO DE CONTA','TIPO']},
  {campo:'observacoes',  nomes:['OBSERVACOES','OBSERVACAO','OBS','OBSERVAÇÕES','OBSERVAÇÃO','ANOTACOES','ANOTAÇÕES']}
];

function normalizar(t){
  return String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function doisDig(n){ return String(n).padStart(2,'0'); }

function statusDaPlanilha(v){
  const t = String(v||'').toUpperCase();
  if(t.includes('DEMIT')) return 'DEMITIDO';
  if(t.includes('AVISO')) return 'AVISO';
  if(t.includes('FERI') || t.includes('FÉRI')) return 'FERIAS';
  return 'EMPREGADO';
}

function lerData(v){
  if(v===''||v==null) return '';
  if(typeof v==='number' && isFinite(v)){
    const d = XLSX.SSF.parse_date_code(v);
    if(d && d.y) return d.y+'-'+doisDig(d.m)+'-'+doisDig(d.d);
    return '';
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    let ano = m[3];
    if(ano.length===2) ano = (+ano > 50 ? '19' : '20') + ano;
    return ano+'-'+doisDig(m[2])+'-'+doisDig(m[1]);
  }
  m = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m) return m[1]+'-'+doisDig(m[2])+'-'+doisDig(m[3]);
  return '';
}

}

async function lerPlanilha(el, arq){
  carregando(true);
  try{
    await usar('xlsx');
    const buf = await arq.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grade = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});

    /* acha a linha de títulos: a primeira que contenha alguma coluna conhecida de nome */
    let iCab = -1;
    for(let i=0; i<Math.min(grade.length, 15); i++){
      if(grade[i].some(c=>COLUNAS[0].nomes.includes(normalizar(c)))){ iCab = i; break; }
    }
    if(iCab<0) throw new Error('Não encontrei a coluna NOME na planilha. Confira a linha de títulos.');

    const cab = grade[iCab].map(normalizar);
    const mapa = {};
    COLUNAS.forEach(col=>{
      const j = cab.findIndex(c=> c && col.nomes.includes(c));
      if(j>=0) mapa[col.campo] = j;
    });
    if(mapa.filial===undefined) throw new Error('Não encontrei a coluna FILIAL na planilha.');

    const existentes = {};
    S.funcionarios.forEach(f=> existentes[normalizar(f.nome)] = f);
    const filiais = {};
    S.filiais.forEach(f=> filiais[f.nome.toUpperCase().trim()] = true);

    const linhas = [];
    for(let i=iCab+1; i<grade.length; i++){
      const l = grade[i];
      const pega = c => mapa[c]===undefined ? '' : l[mapa[c]];
      const nome = String(pega('nome')||'').toUpperCase().trim().replace(/\s+/g,' ');
      const filial = String(pega('filial')||'').toUpperCase().trim();
      if(!nome && !filial) continue;                      /* linha em branco */

      const item = {
        linha: i+1,
        nome, filial,
        cargo: String(pega('cargo')||'').trim(),
        dataAdmissao: lerData(pega('dataAdmissao')),
        dataInicio: lerData(pega('dataInicio')),
        dataDemissao: lerData(pega('dataDemissao')),
        status: statusDaPlanilha(pega('status')),
        cpf: String(pega('cpf')||'').trim(), banco: String(pega('banco')||'').trim(),
        agencia: String(pega('agencia')||'').trim(), conta: String(pega('conta')||'').trim(),
        tipoConta: String(pega('tipoConta')||'').toUpperCase().includes('POUP') ? 'POUPANCA' : 'CORRENTE',
        observacoes: String(pega('observacoes')||'').trim()
      };
      item.aviso = '';
      if(!item.nome) item.situacao='erro', item.aviso='Sem nome';
      else if(!item.filial) item.situacao='erro', item.aviso='Sem filial';
      else if(existentes[normalizar(item.nome)]) item.situacao='dup', item.aviso='Já cadastrado';
      else {
        item.situacao='novo';
        if(!filiais[item.filial]) item.aviso='Filial nova';
        else if(!item.dataAdmissao && mapa.dataAdmissao!==undefined) item.aviso='Sem data de admissão';
      }
      linhas.push(item);
    }
    if(!linhas.length) throw new Error('A planilha não tem linhas de funcionários abaixo dos títulos.');
    carregando(false);
    passoPrevia(el, linhas, arq.name, filiais);
  }catch(e){
    carregando(false);
    toast(e.message, true);
  }
}

async function executarImportacao(el, linhas, duplicados){
  if(!linhas.length) return toast('Não há linhas válidas para importar.', true);
  const btn = el.querySelector('#impConfirmar');
  btn.disabled = true;
  carregando(true);
  const total = {criados:0, atualizados:0, ignorados:0, filiaisCriadas:[], erros:[]};
  const lote = 80;
  try{
    for(let i=0; i<linhas.length; i+=lote){
      btn.textContent = 'Importando ' + Math.min(i+lote, linhas.length) + '/' + linhas.length + '…';
      const r = await api('importarFuncionarios', {
        linhas: linhas.slice(i, i+lote).map(l=>({
          linha:l.linha, nome:l.nome, filial:l.filial, cargo:l.cargo,
          dataAdmissao:l.dataAdmissao, dataInicio:l.dataInicio, dataDemissao:l.dataDemissao,
          status:l.status, observacoes:l.observacoes,
          cpf:l.cpf, banco:l.banco, agencia:l.agencia, conta:l.conta, tipoConta:l.tipoConta
        })),
        duplicados, criarFiliais:true
      });
      total.criados += r.criados;
      total.atualizados += r.atualizados;
      total.ignorados += r.ignorados;
      total.filiaisCriadas = total.filiaisCriadas.concat(r.filiaisCriadas||[]);
      total.erros = total.erros.concat(r.erros||[]);
    }
    await recarregar();
    el.remove();
    const partes = [];
    if(total.criados) partes.push(total.criados+' cadastrados');
    if(total.atualizados) partes.push(total.atualizados+' atualizados');
    if(total.ignorados) partes.push(total.ignorados+' ignorados');
    if(total.filiaisCriadas.length) partes.push(total.filiaisCriadas.length+' filiais criadas');
    toast('Importação concluída: ' + (partes.join(' · ') || 'nada a fazer') + '.');
    if(total.erros.length) console.warn('Linhas não importadas:', total.erros);
  }catch(e){
    toast(e.message, true);
    btn.disabled = false;
    btn.textContent = 'Importar';
  }finally{
    carregando(false);
  }
}

/* ==================================================================
   HORAS EXTRAS — leitura do cartão ponto em PDF e apuração
   Regras aplicadas:
   · extras = o que passa da jornada diária (padrão 07:20)
   · dias sem nenhuma marcação (falta/folga) ficam fora da conta
   · dia sem carga horária prevista (feriado/folga trabalhada) = 100%
   · adicional noturno das 22:00 às 05:00
   · atraso só conta acima da tolerância diária (padrão 10 min)
   ================================================================== */
const DIAS_SEM = 'Seg|Ter|Qua|Qui|Sex|S[áa]b|Dom';

function minParaHora(m){
  const sinal = m<0 ? '-' : '';
  m = Math.abs(Math.round(m));
  return sinal + String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function horaParaMin(t){
  const [h,m] = String(t).split(':');
  return (+h)*60 + (+m);
}
function cruza(a,b,ini,fim){ return Math.max(0, Math.min(b,fim) - Math.max(a,ini)); }

function minutosNoturnos(a,b,ini,fim){
  /* janela noturna atravessa a meia-noite: 22:00→05:00 */
  return cruza(a,b,ini,ini<fim?fim:24*60+fim) + cruza(a,b,0,fim);
}

/* ---------- leitura do PDF ---------- */
async function linhasDoPdf(buffer){
  await usar('pdfjs');
  const pdf = await pdfjsLib.getDocument({data:buffer}).promise;
  const paginas = [];
  for(let p=1; p<=pdf.numPages; p++){
    const pg = await pdf.getPage(p);
    const tc = await pg.getTextContent();
    const itens = tc.items.map(i=>({x:i.transform[4], y:i.transform[5], s:i.str}))
                          .filter(i=>i.s && i.s.trim());
    itens.sort((a,b)=> b.y-a.y || a.x-b.x);
    const linhas = []; let atual = null;
    itens.forEach(i=>{
      if(!atual || Math.abs(atual.y - i.y) > 2.5){ atual = {y:i.y, itens:[i]}; linhas.push(atual); }
      else atual.itens.push(i);
    });
    paginas.push(linhas.map(l=>
      l.itens.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()
    ).filter(Boolean));
  }
  return paginas;
}

function limparCampo(t){
  return String(t||'').split(/\s+(?:PIS|Mat|CPF|Cargo|CEI|CNPJ|Data Admiss)\w*\s*:/)[0].trim();
}

function extrairCartoes(paginas, nomeArquivo){
  const cartoes = [];
  let atual = null;
  paginas.forEach(linhas=>{
    const texto = linhas.join('\n');
    const mNome = texto.match(/Nome:\s*(.+)/);
    if(mNome){
      const nome = limparCampo(mNome[1]).toUpperCase();
      if(!atual || atual.nome !== nome){
        const mCargo = texto.match(/Cargo:\s*(.+)/);
        const mPer = texto.match(/Periodo:\s*(\d{2}\/\d{2}\/\d{4})[\s\S]{0,10}?(\d{2}\/\d{2}\/\d{4})/);
        atual = {
          nome, arquivo: nomeArquivo,
          cargo: mCargo ? limparCampo(mCargo[1]) : '',
          periodoIni: mPer ? mPer[1] : '', periodoFim: mPer ? mPer[2] : '',
          dias: []
        };
        cartoes.push(atual);
      }
    }
    if(!atual) return;
    const re = new RegExp('^(\\d{2}\\/\\d{2}\\/\\d{4})\\s+('+DIAS_SEM+')\\s+(.+)$');
    linhas.forEach(l=>{
      const m = l.match(re);
      if(!m) return;
      const resto = m[3];
      const tempos = resto.match(/\d{1,2}:\d{2}/g);
      if(!tempos || tempos.length < 4) return;
      const defin = resto.slice(0, resto.indexOf(tempos[0])).trim();
      const marcas = tempos.slice(0, tempos.length-4).map(horaParaMin);
      const fim = tempos.slice(-4).map(horaParaMin);
      if(atual.dias.some(d=>d.data===m[1])) return;   /* página repetida */
      atual.dias.push({
        data:m[1], semana:m[2], definicao:defin, marcas,
        ch:fim[0], relDiurno:fim[1], relNoturno:fim[2], relSaldo:fim[3]
      });
    });
  });
  return cartoes.filter(c=>c.dias.length);
}

/* ---------- cálculos cadastrados ---------- */
const CALCULO_PADRAO = {nome:'PADRÃO', jornada:'07:20', jornadaDomingo:'06:00',
  tolerancia:'10', noturnoIni:'22:00', noturnoFim:'05:00', base:'FIXA'};

function calculoPor(id){
  return S.he.calculos.find(c=>c.id===id) || S.he.calculos[0] || CALCULO_PADRAO;
}
function calculoAtual(){ return calculoPor(S.he.calculoId); }
function resumoCalculo(c){
  return c.jornada+' · dom '+c.jornadaDomingo+' · noturno '+c.noturnoIni+'–'+c.noturnoFim+
         ' · tol. '+c.tolerancia+' min'+(c.base==='CH'?' · base CH':'');
}

/* ---------- apuração ---------- */
function apurar(cartao, cfg){
  const notIni = horaParaMin(cfg.noturnoIni), notFim = horaParaMin(cfg.noturnoFim);
  const jornadaFixa = horaParaMin(cfg.jornada);
  const jornadaDom = horaParaMin(cfg.jornadaDomingo || cfg.jornada);
  const tol = +cfg.tolerancia;
  const r = {
    trabalhado:0, he50d:0, he50n:0, he100d:0, he100n:0, noturno:0,
    atrasos:0, diasAtraso:0, diasTrabalhados:0, diasFalta:0, diasFolga:0,
    alertas:[], detalhe:[]
  };

  cartao.dias.forEach(d=>{
    const folga = String(d.definicao||'').toUpperCase()==='FOLGA';
    let mc = d.marcas.slice();
    if(!mc.length){
      /* dia sem marcação: falta desconta, folga não */
      if(folga) r.diasFolga++; else r.diasFalta++;
      r.detalhe.push(Object.assign({}, d, {tipo: folga?'FOLGA':'FALTA',
        trabalhado:0, extra:0, extraNot:0, atraso:0}));
      return;
    }
    if(mc.length % 2){
      r.alertas.push(d.data+': número ímpar de marcações, a última foi ignorada.');
      mc = mc.slice(0,-1);
      if(!mc.length) return;
    }
    const intervalos = [];
    for(let i=0;i<mc.length;i+=2){
      let a=mc[i], b=mc[i+1];
      if(b < a) b += 24*60;                 /* saída depois da meia-noite */
      intervalos.push([a,b]);
    }
    const trabalhado = intervalos.reduce((s,[a,b])=>s+(b-a),0);
    const noturno = intervalos.reduce((s,[a,b])=>s+minutosNoturnos(a,b,notIni,notFim),0);
    r.trabalhado += trabalhado; r.noturno += noturno; r.diasTrabalhados++;

    const cem = d.ch === 0 || d.definicao.toUpperCase() !== 'DIA NORMAL';
    const domingo = String(d.semana||'').toLowerCase().indexOf('dom') === 0;
    const base = cfg.base === 'CH' ? d.ch : (domingo ? jornadaDom : jornadaFixa);
    const extra = cem ? trabalhado : Math.max(0, trabalhado - base);

    /* os minutos extras são os últimos do dia: é ali que cai o adicional noturno */
    let resto = extra, extraNot = 0;
    for(let i=intervalos.length-1; i>=0 && resto>0; i--){
      const [a,b] = intervalos[i];
      const usa = Math.min(resto, b-a);
      extraNot += minutosNoturnos(b-usa, b, notIni, notFim);
      resto -= usa;
    }
    const extraDiu = extra - extraNot;
    if(cem){ r.he100d += extraDiu; r.he100n += extraNot; }
    else   { r.he50d  += extraDiu; r.he50n  += extraNot; }

    let atraso = 0;
    if(!cem){
      const falta = base - trabalhado;
      if(falta > tol){ atraso = falta; r.atrasos += falta; r.diasAtraso++; }
    }
    r.detalhe.push(Object.assign({}, d, {
      tipo: cem ? '100%' : 'NORMAL', trabalhado, extra, extraNot, atraso
    }));
  });

  r.he50 = r.he50d + r.he50n;
  r.he100 = r.he100d + r.he100n;
  r.heNoturnas = r.he50n + r.he100n;
  return r;
}

/* ==================================================================
   CARTÃO PONTO EM FOTO (JPG/PNG)
   A leitura automática de imagem não é confiável neste relatório —
   as marcações vêm coladas na letra de origem e o OCR erra quase tudo.
   Então a foto abre lado a lado com uma grade de digitação: escreve-se
   só as batidas do dia e o sistema calcula o resto pelas mesmas regras.
   ================================================================== */
const SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function diasDaCompetencia(comp){
  const ano = +comp.substring(0,4), mes = +comp.substring(5,7);
  const ultimo = new Date(ano, mes, 0).getDate();
  const dias = [];
  for(let d=1; d<=ultimo; d++){
    const data = new Date(ano, mes-1, d);
    dias.push({
      data: String(d).padStart(2,'0')+'/'+String(mes).padStart(2,'0')+'/'+ano,
      semana: SEMANA[data.getDay()],
      domingo: data.getDay()===0
    });
  }
  return dias;
}

function lerMarcacoes(txt){
  const achados = String(txt||'').match(/\d{1,2}\s*:\s*\d{2}/g) || [];
  return achados.map(t=>horaParaMin(t.replace(/\s/g,'')));
}

/* Grade de digitação/edição das marcações.

      const marcas = lerMarcacoes(el.querySelector(`.m-batida[data-i="${i}"]`).value);

      const cem = el.querySelector(`.m-cem[data-i="${i}"]`).checked;
      const folga = el.querySelector(`.m-folga[data-i="${i}"]`).checked;
      const padrao = d.domingo ? (cfg.jornadaDomingo || cfg.jornada) : cfg.jornada;
      const ch = cem ? 0 : (/^\d{1,2}:\d{2}$/.test(chTxt) ? horaParaMin(chTxt) : horaParaMin(padrao));
      /* folga só vale enquanto não há batida; com batida o dia é trabalho na folga */
      const definicao = (folga && !marcas.length) ? 'Folga' : (cem || (folga && marcas.length)) ? 'Feriado' : 'Dia Normal';
      return {data:d.data, semana:d.semana, definicao, marcas, ch, relDiurno:0, relNoturno:0, relSaldo:0};
    });
  };

  const atualizar = ()=>{
    const r = apurar({nome:'', dias: montar()}, calculoPor(op.calculoId));

        return;
      }
      const partes = [minParaHora(d.trabalhado)];
      if(d.extra) partes.push('+'+minParaHora(d.extra));
      if(d.atraso) partes.push('-'+minParaHora(d.atraso));
      cel.textContent = partes.join('  ');

    const novosDias = montar();

    const cartao = {

      periodoIni: novosDias[0].data, periodoFim: novosDias[novosDias.length-1].data, dias: novosDias
    };

    };
    guardarResultado(item, op.indice);

      try{

          funcionarioId: f.id, tipo:'CARTAO PONTO', competencia: comp,

        });

  };
  return el;
}

function guardarResultado(item, indice){
  if(indice != null && S.he.resultados[indice]) S.he.resultados[indice] = item;
  else {
    const antes = S.he.resultados.findIndex(r=>normalizar(r.nome)===normalizar(item.nome));
    if(antes>=0) S.he.resultados[antes] = item; else S.he.resultados.push(item);
  }
  S.he.resultados.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}

/* corrigir um cartão já apurado */
function editarResultado(i){
  const r = S.he.resultados[i];

    domingo: String(d.semana||'').toLowerCase().indexOf('dom')===0,

function ligarHorasExtras(){
  const sel = document.getElementById('heCalculo');
  if(sel) sel.onchange = ()=>{ S.he.calculoId = sel.value; desenhar(); };

  document.querySelectorAll('[data-calc]').forEach(x=> x.onchange = ev=>{
    ev.stopPropagation();
    const r = S.he.resultados[+x.dataset.calc];
    r.calculoId = x.value;
    r.ap = apurar(r.cartao, calculoPor(r.calculoId));
    desenhar();
  });
  document.querySelectorAll('[data-calc]').forEach(x=> x.onclick = ev=>ev.stopPropagation());

  const area = document.getElementById('heSolta');
  if(area){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.pdf,.jpg,.jpeg,.png'; inp.multiple = true;
    inp.onchange = ()=> importarCartoes([...inp.files]);
    area.onclick = ()=>inp.click();
    area.ondragover = e=>{ e.preventDefault(); area.classList.add('sobre'); };
    area.ondragleave = ()=>area.classList.remove('sobre');
    area.ondrop = e=>{ e.preventDefault(); area.classList.remove('sobre');
      importarCartoes([...e.dataTransfer.files]); };
  }
  const b = id => document.getElementById(id);
  if(b('heExcel')) b('heExcel').onclick = exportarHorasExcel;
  if(b('hePdf')) b('hePdf').onclick = exportarHorasPdf;
  if(b('heSalvar')) b('heSalvar').onclick = salvarApuracao;
  if(b('heSalvas')) b('heSalvas').onclick = verApuracoesSalvas;
  if(b('heCalculos')) b('heCalculos').onclick = gerenciarCalculos;
  document.querySelectorAll('[data-he]').forEach(tr=>
    tr.onclick = ()=>detalheHoras(+tr.dataset.he));
  document.querySelectorAll('[data-editar-he]').forEach(b=> b.onclick = e=>{
    e.stopPropagation(); editarResultado(+b.dataset.editarHe);
  });
  document.querySelectorAll('[data-excluir-he]').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    const i = +b.dataset.excluirHe, r = S.he.resultados[i];
    if(!confirm('Tirar '+r.nome+' desta apuração?\n\nIsso não apaga nada que já tenha sido salvo na planilha.')) return;
    S.he.resultados.splice(i, 1);

  });
  document.querySelectorAll('[data-cadastrar]').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    cadastrarDoCartao(+b.dataset.cadastrar);
  });
}

async function importarCartoes(todos){
  const imagens = todos.filter(a=>/\.(jpe?g|png)$/i.test(a.name));
  const arquivos = todos.filter(a=>/\.pdf$/i.test(a.name));
  if(!arquivos.length && !imagens.length){
    return toast('Envie o espelho de ponto em PDF, JPG ou PNG.', true);
  }
  if(!arquivos.length) return filaDeFotos(imagens);
  carregando(true);
  const erros = [];
  try{
    for(const arq of arquivos){
      try{
        const paginas = await linhasDoPdf(await arq.arrayBuffer());
        const cartoes = extrairCartoes(paginas, arq.name);
        if(!cartoes.length){ erros.push(arq.name+': não encontrei linhas de marcação.'); continue; }
        cartoes.forEach(cart=>{
          const f = S.funcionarios.find(x=>normalizar(x.nome)===normalizar(cart.nome));
          const anterior = S.he.resultados.findIndex(r=>normalizar(r.nome)===normalizar(cart.nome));
          const item = {
            nome: cart.nome, cartao: cart, arquivo: arq.name,
            funcionarioId: f?f.id:'', filial: f?f.filial:'', cargo: (f&&f.cargo)||cart.cargo,
            periodoIni: cart.periodoIni, periodoFim: cart.periodoFim,
            calculoId: S.he.calculoId, ap: apurar(cart, calculoPor(S.he.calculoId))
          };
          if(anterior>=0) S.he.resultados[anterior] = item;
          else S.he.resultados.push(item);
        });
      }catch(e){ erros.push(arq.name+': '+e.message); }
    }
    S.he.resultados.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    desenhar();
    toast(S.he.resultados.length+' cartão(ões) apurado(s).');
    if(erros.length){ console.warn(erros); toast(erros[0], true); }
  }finally{ carregando(false); }
  if(imagens.length) filaDeFotos(imagens);
}

/* as fotos são digitadas uma de cada vez */
function filaDeFotos(imagens){
  const proxima = ()=>{
    const arq = imagens.shift();
    if(!arq) return;
    const el = digitarCartao(arq);
    if(imagens.length){
      const obs = new MutationObserver(()=>{
        if(!document.body.contains(el)){ obs.disconnect(); proxima(); }
      });
      obs.observe(document.getElementById('modais'), {childList:true});
    }
  };
  proxima();
}

                : d.tipo==='FOLGA'?'<span class="tag atual">Folga</span>':esc(d.definicao)}</td>
          <td class="mono" style="color:var(--apagado)">${d.marcas.map(minParaHora).join(' · ')||'—'}</td>
          <td class="mono">${minParaHora(d.trabalhado)}</td>
          <td class="mono" style="color:var(--apagado)">${minParaHora(d.ch)}</td>
          <td class="mono" style="color:${d.extra?'var(--verde)':'inherit'}">${minParaHora(d.extra)}</td>
          <td class="mono">${minParaHora(d.extraNot||0)}</td>
          <td class="mono" style="color:${d.atraso?'var(--vermelho)':'inherit'}">${minParaHora(d.atraso)}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`, true);
  return el;
}

function cadastrarDoCartao(i){
  const r = S.he.resultados[i];
  abrirFuncionario(null, {
    inicial: {
      nome: r.nome,
      cargo: r.cargo || '',
      filial: S.filtroFilial !== 'TODAS' ? S.filtroFilial : ''
    },
    aviso: 'Dados vindos do cartão ponto ' + r.arquivo + '. Escolha a filial e confira a data de admissão.',
    aoSalvar: novoId=>{
      const f = S.funcionarios.find(x=>x.id===novoId);
      if(f){
        S.he.resultados.forEach(x=>{
          if(normalizar(x.nome) === normalizar(f.nome)){
            x.funcionarioId = f.id; x.filial = f.filial; x.cargo = f.cargo || x.cargo;
          }
        });
      }
      desenhar();
    }
  });
}

/* ---------- exportações ---------- */
function linhasResumo(){
  return [['FUNCIONÁRIO','FILIAL','CARGO','PERÍODO','CÁLCULO','JORNADA','JORNADA DOMINGO',
           'DIAS TRABALHADOS','DIAS SEM MARCAÇÃO',
           'HORAS TRABALHADAS','HE 50%','HE 100%','HE NOTURNAS','ADICIONAL NOTURNO',
           'ATRASOS','DIAS COM ATRASO','DIAS DE FOLGA','OBSERVAÇÕES']]
    .concat(S.he.resultados.map(r=>[
      r.nome, r.filial||'', r.cargo||'', r.periodoIni+' a '+r.periodoFim,
      calculoPor(r.calculoId).nome, calculoPor(r.calculoId).jornada,
      calculoPor(r.calculoId).jornadaDomingo,
      r.ap.diasTrabalhados, r.ap.diasFalta, minParaHora(r.ap.trabalhado),
      minParaHora(r.ap.he50), minParaHora(r.ap.he100), minParaHora(r.ap.heNoturnas),
      minParaHora(r.ap.noturno), minParaHora(r.ap.atrasos), r.ap.diasAtraso,
      r.ap.diasFolga || 0, r.observacoes || ''
    ]));
}

async function exportarHorasExcel(){
  await usar('xlsx');
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(linhasResumo());
  ws['!cols'] = [{wch:36},{wch:16},{wch:18},{wch:24},{wch:16}]
    .concat(Array(11).fill({wch:15})).concat([{wch:40}]);
  XLSX.utils.book_append_sheet(wb, ws, 'RESUMO');

  const det = [['FUNCIONÁRIO','DATA','DIA','DEFINIÇÃO','MARCAÇÕES','TRABALHADO','CH','EXTRA','EXTRA NOTURNA','ATRASO']];
  S.he.resultados.forEach(r=> r.ap.detalhe.forEach(d=> det.push([
    r.nome, d.data, d.semana, d.tipo==='FALTA'?'FALTA':d.tipo==='FOLGA'?'FOLGA':d.definicao,
    d.marcas.map(minParaHora).join(' '), minParaHora(d.trabalhado), minParaHora(d.ch),
    minParaHora(d.extra), minParaHora(d.extraNot||0), minParaHora(d.atraso)
  ])));
  const ws2 = XLSX.utils.aoa_to_sheet(det);
  ws2['!cols'] = [{wch:36},{wch:12},{wch:6},{wch:18},{wch:34}].concat(Array(5).fill({wch:14}));
  XLSX.utils.book_append_sheet(wb, ws2, 'DIA A DIA');
  XLSX.writeFile(wb, 'HORAS EXTRAS '+compArquivo(S.competencia)+'.xlsx');
  toast('Planilha gerada.');
}

async function exportarHorasPdf(){
  carregando(true);
  try{
    await usar('pdflib');
    const {PDFDocument, StandardFonts, rgb} = PDFLib;
    const doc = await PDFDocument.create();
    const fonte = await doc.embedFont(StandardFonts.Helvetica);
    const fonteB = await doc.embedFont(StandardFonts.HelveticaBold);
    const logo = await doc.embedPng(b64Bytes(LOGO_ESCURA));
    const L=841.89, A=595.28, m=34;          /* paisagem */
    const cols = [
      {t:'FUNCIONÁRIO', x:m, w:190},{t:'FILIAL', x:m+195, w:70},{t:'CÁLCULO', x:m+250, w:48},
      {t:'TRABALHADAS', x:m+320, w:70},{t:'HE 50%', x:m+395, w:60},
      {t:'HE 100%', x:m+460, w:60},{t:'AD. NOT.', x:m+525, w:60},
      {t:'ATRASOS', x:m+590, w:60},{t:'FALTAS', x:m+655, w:50}
    ];
    let pg, y;
    const cabecalho = ()=>{
      pg = doc.addPage([L,A]); y = A-40;
      const h=15; pg.drawImage(logo,{x:m, y:y, width:logo.width*h/logo.height, height:h});
      pg.drawText('Relatório de horas extras · '+compBonita(S.competencia),
        {x:m, y:y-24, size:13, font:fonteB, color:rgb(.06,.07,.08)});
      const usados = [...new Set(S.he.resultados.map(r=>calculoPor(r.calculoId).nome))];
      pg.drawText('Cálculo: '+usados.map(n=>{
          const c = S.he.calculos.find(x=>x.nome===n) || CALCULO_PADRAO;
          return n+' ('+c.jornada+' / dom '+c.jornadaDomingo+')';
        }).join('  ·  '),
        {x:m, y:y-38, size:8, font:fonte, color:rgb(.42,.45,.5)});
      y -= 58;
      cols.forEach(c=>pg.drawText(c.t,{x:c.x, y, size:7, font:fonteB, color:rgb(.42,.45,.5)}));
      y -= 6;
      pg.drawLine({start:{x:m,y}, end:{x:L-m,y}, thickness:.7, color:rgb(.8,.83,.86)});
      y -= 14;
    };
    const corta = (t,max)=>{ t=String(t||''); return t.length>max?t.slice(0,max-1)+'…':t; };
    cabecalho();
    S.he.resultados.forEach(r=>{
      if(y < m+30) cabecalho();
      const v = [corta(r.nome,36), corta(r.filial,12), corta(calculoPor(r.calculoId).nome,9),
                 minParaHora(r.ap.trabalhado),
                 minParaHora(r.ap.he50), minParaHora(r.ap.he100), minParaHora(r.ap.noturno),
                 minParaHora(r.ap.atrasos), String(r.ap.diasFalta)];
      cols.forEach((c,i)=>pg.drawText(v[i],{x:c.x, y, size:8.5,
        font: i>=4&&i<=5?fonteB:fonte, color:rgb(.06,.07,.08)}));
      if(r.observacoes){
        y -= 10;
        pg.drawText(corta(r.observacoes, 120), {x:cols[0].x, y, size:7.5, font:fonte,
          color:rgb(.42,.45,.5)});
      }
      y -= 8;
      pg.drawLine({start:{x:m,y}, end:{x:L-m,y}, thickness:.4, color:rgb(.93,.94,.95)});
      y -= 12;
    });
    const s = c => S.he.resultados.reduce((a,r)=>a+r.ap[c],0);
    if(y < m+30) cabecalho();
    y -= 4;
    pg.drawText('TOTAL',{x:cols[0].x, y, size:9, font:fonteB});
    [null,null,minParaHora(s('trabalhado')),minParaHora(s('he50')),minParaHora(s('he100')),
     minParaHora(s('noturno')),minParaHora(s('atrasos'))].forEach((t,i)=>{
      if(t) pg.drawText(t,{x:cols[i+1].x, y, size:9, font:fonteB});
    });
    baixar(new Blob([await doc.save()],{type:'application/pdf'}),
      'HORAS EXTRAS '+compArquivo(S.competencia)+'.pdf');
    toast('Relatório em PDF gerado.');
  }catch(e){ toast(e.message,true); }
  finally{ carregando(false); }
}

async function salvarApuracao(){
  if(!S.he.resultados.length) return;
  carregando(true);
  try{
    const itens = S.he.resultados.map(r=>({
      funcionarioId:r.funcionarioId, nome:r.nome, filial:r.filial, cargo:r.cargo,
      periodoIni:r.periodoIni, periodoFim:r.periodoFim,
      calculo:calculoPor(r.calculoId).nome, jornada:calculoPor(r.calculoId).jornada,
      base:calculoPor(r.calculoId).base,
      diasTrabalhados:r.ap.diasTrabalhados, diasFalta:r.ap.diasFalta, diasAtraso:r.ap.diasAtraso,
      totalTrabalhado:minParaHora(r.ap.trabalhado), he50:minParaHora(r.ap.he50),
      he100:minParaHora(r.ap.he100), heNoturnas:minParaHora(r.ap.heNoturnas),
      adicionalNoturno:minParaHora(r.ap.noturno), atrasos:minParaHora(r.ap.atrasos),
      observacoes:r.observacoes || '', arquivo:r.arquivo
    }));
    const r = await api('salvarApuracao', {competencia:S.competencia, itens});
    toast(r.salvos+' apurações salvas na competência '+compBonita(S.competencia)+'.');
  }catch(e){ toast(e.message,true); }
  finally{ carregando(false); }
}

function gerenciarCalculos(){
  const el = modal(`
    <div class="modal-topo">
      <div><small>Horas extras</small><h2>Cálculos</h2></div>
      <button class="fechar" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-corpo" id="calcCorpo"></div>`, true);
  desenharCalculos(el);
}

function linhaCalculo(c, novo){
  return `<tr data-calc-id="${esc(c.id||'')}" ${novo?'data-novo="1"':''}>
    <td><input class="entrada" data-c="nome" value="${esc(c.nome||'')}"
               placeholder="${novo?'Ex.: CALCULO 02':''}" style="min-width:130px"></td>
    <td><input class="entrada mono" data-c="jornada" value="${esc(c.jornada||'07:20')}" style="width:76px"></td>
    <td><input class="entrada mono" data-c="jornadaDomingo" value="${esc(c.jornadaDomingo||'06:00')}" style="width:76px"></td>
    <td><input class="entrada mono" data-c="noturnoIni" value="${esc(c.noturnoIni||'22:00')}" style="width:72px"></td>
    <td><input class="entrada mono" data-c="noturnoFim" value="${esc(c.noturnoFim||'05:00')}" style="width:72px"></td>
    <td><input class="entrada mono" type="number" min="0" max="60" data-c="tolerancia"
               value="${esc(c.tolerancia||'10')}" style="width:64px"></td>
    <td><select class="entrada" data-c="base">
      <option value="FIXA" ${c.base!=='CH'?'selected':''}>Jornadas fixas</option>
      <option value="CH" ${c.base==='CH'?'selected':''}>CH do cartão</option>
    </select></td>
    <td style="text-align:right;white-space:nowrap">
      <button class="link-acao" data-c-salvar="1">${novo?'Criar':'Salvar'}</button>
      ${novo?'':'<button class="link-acao rem" data-c-excluir="1">Excluir</button>'}
    </td></tr>`;
}

function desenharCalculos(el){
  const usados = {};
  S.he.resultados.forEach(r=>{ usados[r.calculoId] = (usados[r.calculoId]||0)+1; });

  el.querySelector('#calcCorpo').innerHTML = `
    <div class="aviso info">
      Cada cartão ponto pode ter a sua jornada. Cadastre aqui os cálculos e escolha
      qual usar na hora de importar — ou troque depois, cartão a cartão, na coluna
      <b>Cálculo</b> da tabela.
    </div>
    <div class="previa" style="max-height:none">
      <table><thead><tr>
        <th>Nome</th><th>Seg a sáb</th><th>Domingo</th><th>Noturno de</th><th>até</th>
        <th>Tolerância</th><th>Base</th><th></th>
      </tr></thead><tbody>
      ${S.he.calculos.map(c=>linhaCalculo(c)).join('')}
      ${linhaCalculo({}, true)}
      </tbody></table>
    </div>
    <div class="prazo" style="margin-top:12px;font-size:12px;color:var(--apagado)">
      A tolerância é em minutos por dia. <b>Base</b> escolhe a régua das horas extras:
      as jornadas cadastradas aqui, ou a carga horária que vem impressa em cada linha do cartão.
      ${Object.keys(usados).length>1?'<br>Nesta apuração há cartões usando cálculos diferentes.':''}
    </div>`;

  el.querySelectorAll('[data-c-salvar]').forEach(b=> b.onclick = async ()=>{
    const tr = b.closest('tr');
    const v = campo => tr.querySelector(`[data-c="${campo}"]`).value;
    const calculo = {
      id: tr.dataset.novo ? '' : tr.dataset.calcId,
      nome: v('nome'), jornada: v('jornada'), jornadaDomingo: v('jornadaDomingo'),
      noturnoIni: v('noturnoIni'), noturnoFim: v('noturnoFim'),
      tolerancia: v('tolerancia'), base: v('base')
    };
    if(!calculo.nome.trim()) return toast('Dê um nome ao cálculo.', true);
    carregando(true);
    try{
      const r = await api('salvarCalculo', {calculo});
      if(tr.dataset.novo) S.he.calculoId = r.id;
      await recarregar();
      recalcular();
      desenharCalculos(el);
      toast('Cálculo salvo.');
    }catch(e){ toast(e.message,true); }
    finally{ carregando(false); }
  });

  el.querySelectorAll('[data-c-excluir]').forEach(b=> b.onclick = async ()=>{
    const tr = b.closest('tr');
    const id = tr.dataset.calcId;
    if(usados[id]) return toast('Este cálculo está em uso nesta apuração. Troque os cartões antes.', true);
    if(!confirm('Excluir o cálculo '+tr.querySelector('[data-c="nome"]').value+'?')) return;
    carregando(true);
    try{
      await api('excluirCalculo', {id});
      await recarregar();
      recalcular();
      desenharCalculos(el);
      toast('Cálculo excluído.');
    }catch(e){ toast(e.message,true); }
    finally{ carregando(false); }
  });
}
