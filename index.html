<style>
:root{
  --tinta:#101215;
  --grafite:#2b2f36;
  --papel:#eceef1;
  --cartao:#ffffff;
  --linha:#dadee4;
  --linha-forte:#c2c8d0;
  --apagado:#6b7280;
  --vermelho:#c8362b;
  --vermelho-suave:#fbeceb;
  --ambar:#c98a10;
  --ambar-suave:#fdf3e0;
  --verde:#1c8a54;
  --verde-suave:#e8f5ee;
  --neutro:#8a93a0;
  --sombra:0 1px 2px rgba(16,18,21,.06), 0 8px 24px -18px rgba(16,18,21,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  background:var(--papel);color:var(--tinta);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- LOGIN ---------- */
#login{
  position:fixed;inset:0;background:var(--papel);color:var(--tinta);
  display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;
}
.login-caixa{
  width:100%;max-width:360px;background:var(--cartao);border:1px solid var(--linha);
  border-radius:4px;padding:34px 30px 30px;box-shadow:var(--sombra);
}
.login-logo{height:46px;width:auto;display:block}
.login-sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--apagado);margin:14px 0 30px}
#login input{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--linha-forte);
  color:var(--tinta);padding:12px 0;margin-bottom:8px;font-size:16px;
}
#login input::placeholder{color:#9aa2ac}
#login input:focus{border-bottom-color:var(--tinta);outline:none}
#login button{
  width:100%;background:var(--tinta);color:#fff;font-weight:600;
  padding:13px;margin-top:22px;border-radius:2px;letter-spacing:.02em;
}
#login button:hover{background:var(--grafite)}
#login button:disabled{opacity:.5}
.login-erro{color:var(--vermelho);font-size:13px;margin-top:14px;min-height:18px}

/* ---------- CABEÇALHO ---------- */
header{
  background:var(--cartao);color:var(--tinta);position:sticky;top:0;z-index:40;
  border-bottom:1px solid var(--linha);
}
.topo{
  display:flex;align-items:center;gap:16px;
  padding:12px 20px;max-width:1360px;margin:0 auto;
}
.marca{display:flex;align-items:center;gap:11px;white-space:nowrap}
.marca img{height:24px;width:auto;display:block}
.marca span{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--apagado);border-left:1px solid var(--linha);padding-left:11px}
.topo-espaco{flex:1}
.comp-campo{
  display:flex;align-items:center;gap:10px;background:#f6f7f9;flex:none;
  border:1px solid var(--linha);border-radius:2px;padding:5px 12px 5px 10px;
}
.comp-campo label{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado);
  white-space:nowrap;flex:none;
}
.comp-campo input{
  background:transparent;border:none;color:var(--tinta);font-size:14px;
  font-family:'JetBrains Mono',monospace;
  width:auto;min-width:118px;max-width:none;flex:none;padding:2px 0;
}
.comp-campo input::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
.estado{
  display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:2px;
  background:#f6f7f9;border:1px solid var(--linha);font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);white-space:nowrap;flex:none;
}
.estado i{width:7px;height:7px;border-radius:50%;background:var(--verde);flex:none}
.estado.trabalhando{background:var(--ambar-suave);border-color:rgba(201,138,16,.3);color:var(--ambar)}
.estado.trabalhando i{background:var(--ambar);animation:pulsa 1s ease-in-out infinite}
.estado.salvo{background:var(--verde-suave);border-color:rgba(28,138,84,.3);color:var(--verde)}
.estado.salvo i{background:var(--verde)}
.estado.fora{background:var(--vermelho-suave);border-color:rgba(200,54,43,.3);color:var(--vermelho)}
.estado.fora i{background:var(--vermelho)}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
@media(max-width:820px){.estado span{display:none}.estado{padding:5px 8px}}

.quem{text-align:right;line-height:1.15}
.quem b{display:block;font-size:13px;font-weight:600}
.quem small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado)}
.icone-btn{
  width:36px;height:36px;border-radius:2px;display:grid;place-items:center;
  background:#f6f7f9;border:1px solid var(--linha);color:var(--grafite);
}
.icone-btn:hover{background:#eaedf1;color:var(--tinta)}
nav{border-top:1px solid var(--linha)}
.abas{display:flex;gap:2px;max-width:1360px;margin:0 auto;padding:0 12px;overflow-x:auto}
.aba{
  padding:11px 14px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--apagado);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;
  margin-bottom:-1px;
}
.aba:hover{color:var(--tinta)}
.aba.on{color:var(--tinta);border-bottom-color:var(--tinta)}

/* ---------- LAYOUT ---------- */
main{max-width:1360px;margin:0 auto;padding:20px}
.barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.busca{position:relative;flex:1;min-width:220px}
.busca input{
  width:100%;padding:10px 12px 10px 34px;border:1px solid var(--linha);
  border-radius:2px;background:var(--cartao);
}
.busca svg{position:absolute;left:11px;top:11px;color:var(--apagado)}
select.campo,input.campo{
  padding:10px 12px;border:1px solid var(--linha);border-radius:2px;background:var(--cartao);
}
.btn{
  padding:10px 14px;border-radius:2px;font-weight:600;font-size:13px;
  background:var(--tinta);color:#fff;letter-spacing:.01em;
}
.btn:hover{background:var(--grafite)}
.btn.sec{background:var(--cartao);color:var(--tinta);border:1px solid var(--linha-forte)}
.btn.sec:hover{background:#f6f7f9}
.btn.perigo{background:var(--vermelho)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mini{padding:6px 10px;font-size:12px}

/* ---------- FILIAL ---------- */
.filial{background:var(--cartao);border:1px solid var(--linha);border-radius:3px;margin-bottom:14px;overflow:hidden}
.filial-topo{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--linha)}
.filial-nome{font-weight:600;letter-spacing:.02em}
.filial-qtd{font-size:11px;color:var(--apagado);letter-spacing:.1em;text-transform:uppercase}
.semaforo{display:flex;height:6px;width:170px;border-radius:3px;overflow:hidden;background:#e6e9ed}
.semaforo i{display:block;height:100%}
.semaforo-legenda{font-size:11px;color:var(--apagado);display:flex;gap:10px;white-space:nowrap}
.semaforo-legenda b{font-family:'JetBrains Mono',monospace;font-weight:700}

/* ---------- LINHA DE FUNCIONÁRIO ---------- */
.linha-func{
  display:grid;grid-template-columns:4px 1fr 130px 110px 92px 140px;
  align-items:center;gap:14px;padding:0 16px 0 0;border-bottom:1px solid #eef0f3;
}
.linha-func:last-child{border-bottom:none}
.linha-func:hover{background:#fafbfc}
.marcador{height:100%;min-height:52px}
.m-vermelho{background:var(--vermelho)} .m-ambar{background:var(--ambar)}
.m-verde{background:var(--verde)} .m-neutro{background:#dfe3e8}
.nome{font-weight:600;padding:14px 0;letter-spacing:.01em}
.nome.c-vermelho{color:var(--vermelho)} .nome.c-ambar{color:var(--ambar)}
.nome.c-verde{color:var(--verde)} .nome.c-neutro{color:var(--tinta)}
.nome small{display:block;font-weight:400;font-size:12px;color:var(--apagado);letter-spacing:0}
.selo{
  display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;font-weight:600;
}
.selo.emp{background:#eef1f4;color:var(--grafite)}
.selo.dem{background:#f4e6e5;color:var(--vermelho)}
.selo.alerta{background:var(--vermelho);color:#fff}
.cel{font-size:13px;color:var(--grafite)}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.vazio{padding:44px 20px;text-align:center;color:var(--apagado)}
.vazio b{display:block;color:var(--tinta);margin-bottom:6px}

/* ---------- MODAL ---------- */
.fundo{
  position:fixed;inset:0;background:rgba(16,18,21,.55);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;
}
.modal{
  background:var(--cartao);width:100%;max-width:720px;border-radius:3px;
  box-shadow:var(--sombra);margin:auto;
}
.modal.larga{max-width:1000px}
.modal-topo{
  display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--linha);
  position:sticky;top:0;background:var(--cartao);z-index:2;border-radius:3px 3px 0 0;
}
.modal-topo h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.modal-topo small{display:block;font-size:11px;color:var(--apagado);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.fechar{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;color:var(--apagado);border-radius:2px}
.fechar:hover{background:#f0f2f5;color:var(--tinta)}
.modal-corpo{padding:20px}
.modal-pe{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--linha);flex-wrap:wrap}

.campo-lbl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado);font-weight:600;margin-bottom:5px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grade .full{grid-column:1/-1}
.entrada{width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:2px;background:#fff}
textarea.entrada{min-height:70px;resize:vertical}

/* ---------- DOCUMENTOS ---------- */
.docs-cabecalho{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 14px;background:#f6f7f9;border:1px solid var(--linha);border-radius:2px;margin-bottom:16px;
}
.docs-cabecalho .prazo{font-size:12px;color:var(--apagado)}
.docs-cabecalho .prazo b{color:var(--tinta)}
.colunas-docs{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px 22px;align-items:start}
.grade-docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
@media(max-width:900px){.colunas-docs{grid-template-columns:1fr}}
.card-doc{border:1px solid var(--linha);border-radius:3px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card-doc.falta{border-style:dashed;border-color:var(--linha-forte)}
.card-doc-topo{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--linha)}
.card-doc-tipo{font-size:10.5px;font-weight:700;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ponto{width:7px;height:7px;border-radius:50%;flex:none}
.p-vermelho{background:var(--vermelho)} .p-ambar{background:var(--ambar)} .p-verde{background:var(--verde)}
.miniatura{
  height:96px;background:#f4f6f8;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;
}
.miniatura img{width:100%;height:100%;object-fit:cover}
.miniatura .pdf-marca{font-size:11px;letter-spacing:.14em;color:var(--apagado);font-weight:700}
.miniatura.sem{cursor:default;color:#b7bec7;font-size:12px}
.card-doc-pe{display:flex;gap:3px;padding:6px;border-top:1px solid #eef0f3;flex-wrap:wrap}
.link-acao{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--grafite);padding:3px 5px;border-radius:2px}
.link-acao:hover{background:#f0f2f5}
.link-acao.rem{color:var(--vermelho)}
.link-acao.apr{color:var(--verde)}
.check-exp{position:absolute;top:6px;left:6px;width:18px;height:18px;accent-color:var(--tinta);z-index:2}
.hist-comp{margin-top:22px;border-top:1px solid var(--linha);padding-top:16px}
.hist-titulo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado);font-weight:600;margin-bottom:10px}
.hist-linha{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3f5;font-size:13px;flex-wrap:wrap}
.hist-linha:last-child{border:none}

/* ---------- VISUALIZADOR ---------- */
#visor{position:fixed;inset:0;background:rgba(16,18,21,.93);z-index:80;display:flex;flex-direction:column}
#visor .visor-topo{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff}
#visor .visor-topo b{font-size:14px}
#visor .visor-topo small{color:#9aa3ad;font-size:12px}
#visor .visor-area{flex:1;display:grid;place-items:center;padding:0 18px 18px;overflow:auto}
#visor img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
#visor iframe{width:100%;height:100%;border:none;background:#fff}

/* ---------- ADMIN ---------- */
.sub-abas{display:flex;gap:2px;border-bottom:1px solid var(--linha);margin-bottom:18px}
.sub-aba{padding:9px 13px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--apagado);border-bottom:2px solid transparent}
.sub-aba.on{color:var(--tinta);border-bottom-color:var(--tinta)}
table.lista{width:100%;border-collapse:collapse;font-size:14px}
table.lista th{
  text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--apagado);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linha);
}
table.lista td{padding:10px;border-bottom:1px solid #f1f3f5;vertical-align:middle}
table.lista tr:last-child td{border-bottom:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--linha);
  border-radius:2px;font-size:12px;cursor:pointer;background:#fff;
}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.aviso{padding:11px 13px;border-radius:2px;font-size:13px;margin-bottom:14px}
.aviso.info{background:#eef2f7;color:var(--grafite)}
.aviso.erro{background:var(--vermelho-suave);color:var(--vermelho)}

/* ---------- LISTA COMPACTA DE FUNCIONÁRIOS ---------- */
.rolagem{overflow-x:auto}
/* rola na horizontal e na vertical: é o que permite congelar o cabeçalho */
.rolagem-alta{overflow:auto;max-height:calc(100vh - 250px);min-height:260px}
.espaco-filial td{height:12px;padding:0;border:none;background:var(--papel)}
.tab-func{width:100%;border-collapse:collapse;font-size:13px;min-width:1080px}
.tab-func th{
  position:sticky;top:0;background:#f6f7f9;text-align:left;padding:7px 10px;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--apagado);
  font-weight:700;border-bottom:1px solid var(--linha);white-space:nowrap;z-index:2;
}
.tab-func td{
  padding:4px 10px;border-bottom:1px solid #f1f3f5;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.tab-func tr:last-child td{border-bottom:none}
.tab-func tbody tr:hover{background:#fafbfc}
.tab-func .t-nome{font-weight:600;max-width:290px}
.tab-func .t-filial{color:var(--grafite);font-weight:600;max-width:130px}
.tab-func .t-apagado{color:var(--apagado);max-width:150px}
.tab-func .t-banco{font-size:11.5px;max-width:210px}
.tab-func .t-obs{color:var(--apagado);font-style:italic;font-size:12px;max-width:230px}
.tab-func .d-falta{color:var(--ambar);font-style:italic}
.tab-func .selo{padding:2px 6px}
.tab-func .btn.mini{padding:4px 9px;font-size:11.5px}
.bolinha{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:8px;vertical-align:1px;flex:none;
}
@media(max-width:820px){
  .tab-func{min-width:760px}
  .tab-func .t-apagado,.tab-func .t-obs{display:none}
  .tab-func th:nth-child(3),.tab-func th:nth-child(4),.tab-func th:nth-child(10){display:none}
}

/* ---------- FOLHA DE PAGAMENTO ---------- */
.tab-folha{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
.tab-folha th{
  position:sticky;top:0;background:#f6f7f9;text-align:left;padding:7px 9px;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--apagado);
  font-weight:700;border-bottom:1px solid var(--linha);white-space:nowrap;z-index:2;
}
.tab-folha td{padding:4px 9px;border-bottom:1px solid #f1f3f5;white-space:nowrap}
.tab-folha tbody tr:hover{background:#fafbfc}
.tab-folha .t-nome{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tab-folha .t-apagado{color:var(--apagado)}
.tab-folha .t-total{text-align:right;font-weight:600;background:#fafcfb}
.tab-folha tfoot td{background:#f6f7f9;border-top:1px solid var(--linha-forte);padding:9px;text-align:right}
.tab-folha tfoot td:first-child{text-align:left}
.cel-folha{padding:4px 7px;font-size:13px;width:100%;min-width:78px}
.cel-folha.dinheiro,.cel-folha.numero{font-family:'JetBrains Mono',monospace;text-align:right}
.cel-folha.numero{min-width:58px}
.cel-folha:focus{background:#fffdf5}
.cel-com{padding:4px 7px;font-size:13px;width:100%;min-width:78px;
  font-family:'JetBrains Mono',monospace;text-align:right}
.cel-com:focus{background:#fffdf5}
.cel-vale{padding:4px 6px;font-size:12px;width:100%;min-width:70px}
.cel-vale.nao{color:var(--vermelho);font-weight:600}
.cel-folha:disabled{background:#f4f5f7;color:#b7bec7}

/* ---------- TABELAS COMPACTAS DE VALORES ---------- */
.grade-valores{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:14px 28px;padding:14px 16px 18px;align-items:start;
}
.mini-tab{width:100%;border-collapse:collapse;font-size:12px}
.mini-tab th{
  text-align:left;padding:4px 6px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--apagado);font-weight:700;border-bottom:1px solid var(--linha);white-space:nowrap;
}
.mini-tab td{padding:2px 6px;border-bottom:1px solid #f4f5f7}
.mini-tab tr:last-child td{border-bottom:none}
.mini-tab .f-nome{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-tab .g-uso{text-align:center;color:var(--apagado);font-family:'JetBrains Mono',monospace}
.g-campo{padding:3px 6px;font-size:12px;width:100%;min-width:0;border-color:transparent;background:transparent}
.g-campo:hover{border-color:var(--linha)}
.g-campo:focus{border-color:var(--tinta);background:#fffdf5}
.g-campo.mono{text-align:right}
select.g-campo.sem{color:var(--ambar)}
.g-x{color:#c2c8d0;font-size:13px;line-height:1;padding:2px 4px;border-radius:2px}
.g-x:hover{color:var(--vermelho);background:var(--vermelho-suave)}
@media(max-width:820px){.grade-valores{grid-template-columns:1fr}}

/* ---------- CONTABILIDADE ---------- */
.tab-cont{min-width:1180px}
.tab-cont th{white-space:nowrap;font-size:9px}
.tab-cont td{padding:5px 6px}
.tab-cont .col-fixa{
  position:sticky;left:0;background:#fff;z-index:1;min-width:210px;
  box-shadow:1px 0 0 var(--linha);
}
.tab-cont thead .col-fixa{background:#f6f7f9;z-index:3}
.tab-cont tfoot .col-fixa{background:#f6f7f9}
.tab-cont th.col-auto{background:#eef4f0;color:var(--verde)}
.tab-cont td.col-auto{background:#fafcfb}
.tab-cont tfoot td{background:#f6f7f9;border-top:1px solid var(--linha-forte);padding:9px 6px}
.cel-cont{padding:5px 7px;font-size:13px;width:100%;min-width:82px}
.cel-cont.dinheiro,.cel-cont.hora,.cel-cont.numero{
  font-family:'JetBrains Mono',monospace;text-align:right;
}
.cel-cont::placeholder{color:#b9c0c8;font-style:italic}
.cel-cont:focus{background:#fffdf5}

/* ---------- ANEXAR DOCUMENTOS ---------- */
.linha-anexo{
  display:grid;grid-template-columns:4px 1fr 60px 110px;align-items:center;gap:14px;
  padding:0 16px 0 0;border-bottom:1px solid #eef0f3;cursor:pointer;
}
.linha-anexo:last-child{border-bottom:none}
.linha-anexo:hover{background:#fafbfc}
.linha-anexo > div:nth-child(2){padding:12px 0}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{
  font-size:10px;letter-spacing:.08em;font-weight:600;padding:3px 7px;border-radius:2px;
  border:1px solid transparent;white-space:nowrap;
}
.pill.falta{background:var(--vermelho-suave);color:var(--vermelho);border-color:rgba(200,54,43,.25)}
.pill.anexado{background:var(--ambar-suave);color:var(--ambar);border-color:rgba(201,138,16,.25)}
.pill.aprovado{background:var(--verde-suave);color:var(--verde);border-color:rgba(28,138,84,.25)}
.foto-ponto{
  border:1px solid var(--linha);border-radius:3px;background:#f4f6f8;overflow:auto;
  max-height:300px;display:grid;place-items:center;
}
.foto-ponto img{max-width:100%;display:block}
.foto-ponto.cheia{max-height:none}
.foto-ponto.cheia img{max-width:none;width:auto}
.m-batida:focus{background:#fffdf5}
.mini-sel{padding:5px 7px;font-size:12px;max-width:132px}
.obs-he{padding:6px 8px;font-size:13px;min-width:180px}

.titulo-grupo{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:var(--grafite);margin:22px 0 10px;display:flex;align-items:baseline;gap:9px;
}
.titulo-grupo small{
  font-size:11px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--apagado);
}
.pill.opcional{background:#eef1f4;color:var(--grafite);border-color:var(--linha)}
.p-neutro{background:#c8ccd3}
.colunas-tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;align-items:start}
@media(max-width:820px){.colunas-tipos{grid-template-columns:1fr}}
.linha-tipo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.linha-tipo .entrada{max-width:none}
.linha-tipo .entrada{flex:1;max-width:340px}
@media(max-width:820px){
  .linha-anexo{grid-template-columns:4px 1fr auto;padding-right:12px}
}

/* ---------- IMPORTAÇÃO ---------- */
.solta{
  border:1px dashed var(--linha-forte);border-radius:3px;padding:32px 20px;text-align:center;
  background:#fafbfc;cursor:pointer;
}
.solta:hover,.solta.sobre{background:#f2f5f9;border-color:var(--tinta)}
.solta b{display:block;margin-bottom:4px}
.solta small{color:var(--apagado)}
.previa{max-height:340px;overflow:auto;border:1px solid var(--linha);border-radius:2px}
.previa table{width:100%;border-collapse:collapse;font-size:13px}
.previa th{
  position:sticky;top:0;background:#f6f7f9;text-align:left;padding:8px 10px;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);
  font-weight:600;border-bottom:1px solid var(--linha);
}
.previa td{padding:7px 10px;border-bottom:1px solid #f1f3f5;white-space:nowrap}
.previa tr:last-child td{border-bottom:none}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:2px}
.tag.novo{background:var(--verde-suave);color:var(--verde)}
.tag.atual{background:#eef2f7;color:var(--grafite)}
.tag.dup{background:var(--ambar-suave);color:var(--ambar)}
button.tag.dup{cursor:pointer;border:1px solid rgba(201,138,16,.35)}
button.tag.dup:hover{background:var(--ambar);color:#fff;border-color:var(--ambar)}
.tag.erro{background:var(--vermelho-suave);color:var(--vermelho)}
.resumo-imp{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.resumo-imp div{font-size:12px;color:var(--apagado)}
.resumo-imp b{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--tinta)}

/* ---------- PENDÊNCIAS ---------- */
.linha-pend{cursor:pointer}
.linha-pend:hover td{background:#fafbfc}
.linha-pend.aberta td{background:#f2f5f9;font-weight:600}
.seta{color:var(--apagado);font-size:10px;margin-right:2px}
.detalhe-pend td{background:#f8f9fb;padding:0 !important}
.cx-pend{padding:12px 14px 14px}
.linha-pend-func{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;
  border-bottom:1px solid #e9ecf0;font-size:13px;text-align:left;
}
.linha-pend-func:last-child{border-bottom:none}
.pend-falta{color:var(--vermelho);font-size:12px}
.pend-conferir{color:var(--ambar);font-size:12px}
.painel{background:var(--cartao);border:1px solid var(--linha);border-radius:3px;padding:18px;overflow-x:auto}
.matriz{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
.matriz th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);font-weight:600;padding:9px;text-align:center;border-bottom:1px solid var(--linha)}
.matriz th:first-child{text-align:left}
.matriz td{padding:9px;text-align:center;border-bottom:1px solid #f1f3f5;font-family:'JetBrains Mono',monospace}
.matriz td:first-child{text-align:left;font-family:'Archivo',sans-serif;font-weight:600}
.cel-ok{color:var(--verde)} .cel-falta{color:var(--vermelho);font-weight:700}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);
  background:var(--tinta);color:#fff;padding:12px 18px;border-radius:2px;font-size:14px;
  z-index:200;transition:transform .22s ease;max-width:90vw;box-shadow:var(--sombra);
}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.erro{background:var(--vermelho)}

/* ---------- CARREGANDO ---------- */
#carregando{
  position:fixed;inset:0;background:rgba(236,238,241,.75);z-index:150;display:none;
  place-items:center;backdrop-filter:blur(1px);
}
#carregando.on{display:grid}
.giro{width:26px;height:26px;border:2px solid var(--linha-forte);border-top-color:var(--tinta);border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

@media(max-width:820px){
  .linha-func{grid-template-columns:4px 1fr auto;gap:10px;padding-right:12px}
  .linha-func .esconde-mob{display:none}
  .acoes{grid-column:3}
  .topo{flex-wrap:wrap;gap:10px}
  .comp-campo{order:3;width:100%}
  .comp-campo input{flex:1;min-width:0}
  .semaforo{width:110px}
  .semaforo-legenda{display:none}
  .grade{grid-template-columns:1fr}
  .fundo{padding:0}
  .modal{border-radius:0;min-height:100vh}
}

</head>

<div id="app" style="display:none">
  <header>

          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>

  <main id="conteudo"></main>

<div id="toast"></div>
<div id="carregando"><div class="giro"></div></div>
<div id="modais"></div>

<script>
/* ==================================================================
   IDENTIDADE VISUAL
   ================================================================== */
/* ==================================================================
   BIBLIOTECAS SOB DEMANDA
   Somam vários megabytes e servem só para exportar PDF, ler planilha e
   ler cartão ponto. Entrar no sistema não precisa esperar por elas.
   ================================================================== */
const BIBLIOTECAS = {
  pdflib: {
    url:'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
    pronta:()=>window.PDFLib
  },
  xlsx: {
    url:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    pronta:()=>window.XLSX
  },
  pdfjs: {
    url:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pronta:()=>window.pdfjsLib,
    depois:()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  }
};
const _pedidas = {};
function usar(nome){
  const b = BIBLIOTECAS[nome];
  if(b.pronta()) return Promise.resolve();
  if(_pedidas[nome]) return _pedidas[nome];
  _pedidas[nome] = new Promise((ok, erro)=>{
    const tag = document.createElement('script');
    tag.src = b.url;
    tag.onload = ()=>{ if(b.depois) b.depois(); ok(); };
    tag.onerror = ()=>{ delete _pedidas[nome];
      erro(new Error('Não consegui carregar um recurso da internet. Tente de novo.')); };
    document.head.appendChild(tag);
  });
  return _pedidas[nome];
}

document.getElementById('logoLogin').src = 'data:image/png;base64,' + LOGO_ESCURA;
document.getElementById('logoTopo').src  = 'data:image/png;base64,' + LOGO_ESCURA;

/* ==================================================================
   ESTADO
   ================================================================== */
const S = {
  sessao:null, senha:'', usuario:'',
  filiais:[], usuarios:[], funcionarios:[], documentos:[], prazos:[],
  config:{diaLimite:'10', tiposObrigatorios:['HOLERITE','VALE','VR','VT','CARTAO PONTO'],
          tiposOpcionais:[]},
  competencia: hojeCompetencia(),
  aba:'FUNCIONARIOS', filtroFilial:'TODAS', busca:'', tiposEdit:null, pendAberta:null,
  docsFunc:null, docsLista:[], selecao:new Set(), cacheArquivo:{},
  he:{ calculos:[], calculoId:'', resultados:[] },
  cont:{ competencia:null, linhas:{}, apuracoes:[], comissoes:[] },
  grupos:[],
  folha:{ competencia:null, linhas:{}, diasPadrao:'' },
  com:{ competencia:null, metas:{}, dias:[], metaPadrao:'' }
};

const ROTULO_ABA = {
  ANEXAR:'Anexar documentos',
  FUNCIONARIOS:'Funcionários',
  EX_FUNCIONARIOS:'Ex-funcionários',
  PENDENCIAS:'Pendências',
  HORAS_EXTRAS:'Horas extras',
  COMISSOES:'Comissões',
  CONTABILIDADE:'Contabilidade',
  FOLHA:'Folha de pagamento'
};

/* ==================================================================
   UTILIDADES
   ================================================================== */
function hojeCompetencia(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function compBonita(c){ return c ? c.substring(5,7)+'/'+c.substring(0,4) : '—'; }
function compArquivo(c){ return c.substring(5,7)+'-'+c.substring(0,4); }
function dataBonita(d){
  if(!d) return '—';
  const p = String(d).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d;
}
function fimDoMes(c){
  const a=+c.substring(0,4), m=+c.substring(5,7);
  return new Date(a, m, 0);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg, erro){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className = erro?'on erro':'on';
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3400);
}
function carregando(on){ document.getElementById('carregando').classList.toggle('on',!!on); }

/* ---------- indicador de conexão ---------- */
let chamadasAbertas = 0;
const ESCRITAS = /^(salvar|enviar|excluir|aprovar|importar|trocar|alterar)/;

function mostrarEstado(classe, texto){
  const e = document.getElementById('estado');
  if(!e) return;
  e.className = 'estado' + (classe?' '+classe:'');
  e.querySelector('span').textContent = texto;
}
function estadoParado(){
  if(chamadasAbertas) return;
  if(!navigator.onLine) mostrarEstado('fora','Offline');
  else mostrarEstado('','Online');
}
window.addEventListener('offline', ()=>mostrarEstado('fora','Offline'));
window.addEventListener('online', ()=>{ mostrarEstado('','Online'); });

async function api(acao, dados={}){
  if(API.indexOf('COLE_AQUI')===0){
    throw new Error('Cole a URL do Apps Script na constante API, no topo do arquivo.');
  }
  if(!navigator.onLine){
    mostrarEstado('fora','Offline');
    throw new Error('Sem internet. Reconecte e tente de novo — nada foi perdido.');
  }
  const escrita = ESCRITAS.test(acao);
  chamadasAbertas++;
  mostrarEstado('trabalhando', escrita ? 'Salvando…' : 'Carregando…');
  const corpo = Object.assign({acao, usuario:S.usuario, senha:S.senha}, dados);
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(corpo)
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro||'Erro no servidor.');
    chamadasAbertas--;
    if(!chamadasAbertas && escrita){
      mostrarEstado('salvo','Salvo');
      setTimeout(estadoParado, 2200);
    }else estadoParado();
    return j.data;
  }catch(e){
    chamadasAbertas--;
    if(e instanceof TypeError){        /* falha de rede, não do servidor */
      mostrarEstado('fora','Sem conexão');
      throw new Error('Não consegui falar com a nuvem. Verifique a internet e tente de novo.');
    }
    estadoParado();
    throw e;
  }
}

/* ==================================================================
   LOGIN
   ================================================================== */
document.getElementById('btnEntrar').onclick = entrar;
['loginUsuario','loginSenha'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
});

async function entrar(){
  const u = document.getElementById('loginUsuario').value.trim();
  const p = document.getElementById('loginSenha').value;
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('btnEntrar');
  if(!p){ erro.textContent='Digite a senha.'; return; }
  erro.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  S.usuario = u || 'MASTER'; S.senha = p;
  try{
    /* uma única ida ao servidor: valida a senha e já traz os dados da tela */
    const r = await api('login', {competencia:S.competencia});
    S.sessao = r.sessao;
    try{ sessionStorage.setItem('rh', JSON.stringify({u:S.usuario, s:S.senha})); }catch(e){}
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    prepararTela();
    aplicarCarga(r);
  }catch(e){
    erro.textContent = e.message;
    S.usuario=''; S.senha='';
  }finally{
    btn.disabled=false; btn.textContent='Entrar';
  }
}

document.getElementById('btnSair').onclick = ()=>{
  try{ sessionStorage.removeItem('rh'); }catch(e){}
  location.reload();
};

/* ==================================================================
   CARGA
   ================================================================== */
function prepararTela(){
  const comp = document.getElementById('competencia');
  comp.value = S.competencia;
  comp.onchange = e=>{
    S.competencia = e.target.value || hojeCompetencia();
    recarregar();
  };
  document.getElementById('btnAdmin').onclick = abrirAdmin;
}

function aplicarCarga(d){
  S.sessao = d.sessao;
  S.filiais = d.filiais;
  S.usuarios = d.usuarios;
  S.funcionarios = d.funcionarios;
  S.documentos = d.documentos;
  S.prazos = d.prazos;
  S.versaoServidor = d.versao || '';
  S.he.calculos = d.calculos || [];
  S.grupos = d.grupos || [];
  if(S.folha.competencia && S.folha.competencia !== S.competencia) S.folha.competencia = null;
  if(S.com.competencia && S.com.competencia !== S.competencia) S.com.competencia = null;
  if(S.cont.competencia && S.cont.competencia !== S.competencia) S.cont.competencia = null;
  if(!S.he.calculos.find(c=>c.id===S.he.calculoId)){
    S.he.calculoId = S.he.calculos.length ? S.he.calculos[0].id : '';
  }
  S.tiposEdit = null;
  S.config = {
    diaLimite: d.config.diaLimite || '10',
    tiposObrigatorios: (d.config.tiposObrigatorios && d.config.tiposObrigatorios.length)
      ? d.config.tiposObrigatorios : S.config.tiposObrigatorios,
    tiposOpcionais: d.config.tiposOpcionais || []
  };
  if(!S.sessao.abas.includes(S.aba)) S.aba = S.sessao.abas[0] || 'FUNCIONARIOS';
  desenhar();
}

async function recarregar(){
  carregando(true);
  try{
    aplicarCarga(await api('carregar', {competencia:S.competencia}));
  }catch(e){
    toast(e.message, true);
  }finally{
    carregando(false);
  }
}

/* ==================================================================
   REGRA DE COR
   ================================================================== */
function docsDe(funcId, comp){
  return S.documentos.filter(d=>d.funcionarioId===funcId && (!comp || d.competencia===comp));
}

function situacao(f){
  if(f.status==='DEMITIDO') return 'neutro';
  if(f.dataAdmissao){
    const adm = new Date(f.dataAdmissao+'T12:00:00');
    if(adm > fimDoMes(S.competencia)) return 'neutro';   // admitido depois da competência
  }
  const meus = docsDe(f.id, S.competencia);
  const obrig = S.config.tiposObrigatorios;
  const achados = obrig.map(t=>meus.find(d=>d.tipo===t));
  if(achados.some(d=>!d)) return 'vermelho';
  return achados.every(d=>d.status==='APROVADO') ? 'verde' : 'ambar';
}

const SITUACOES = {
  EMPREGADO:{rotulo:'Empregado', classe:'emp'},
  AVISO:    {rotulo:'Aviso prévio', classe:'alerta'},
  FERIAS:   {rotulo:'Férias', classe:'alerta'},
  DEMITIDO: {rotulo:'Demitido', classe:'dem'}
};
function selo(status){
  const s = SITUACOES[status] || SITUACOES.EMPREGADO;
  return `<span class="selo ${s.classe}">${s.rotulo}</span>`;
}

function podeAprovar(){
  return S.sessao && (S.sessao.papel==='MASTER' || S.sessao.papel==='GERENTE_RH');
}
function ehMaster(){ return S.sessao && S.sessao.papel==='MASTER'; }
function podeImportar(){ return podeAprovar(); }

function prazoDaCompetencia(){
  const p = S.prazos.find(x=>x.competencia===S.competencia);
  if(p) return p.dataLimite;
  const a=+S.competencia.substring(0,4), m=+S.competencia.substring(5,7);
  const prox = new Date(a, m, Math.min(+S.config.diaLimite||10, 28));
  return prox.toISOString().substring(0,10);
}

/* ==================================================================
   DESENHO
   ================================================================== */
function desenhar(){
  document.getElementById('quemNome').textContent = S.sessao.usuario;
  document.getElementById('quemPapel').textContent =
    S.sessao.papel==='MASTER' ? 'Master'
    : S.sessao.papel==='GERENTE_RH' ? 'Gerente RH'
    : (S.sessao.filial || 'Gerente');
  document.getElementById('btnAdmin').style.display = ehMaster() ? '' : 'none';

  const nav = document.getElementById('abas');
  nav.innerHTML = S.sessao.abas.filter(a=>a!=='ADMIN').map(a=>
    `<button class="aba ${a===S.aba?'on':''}" data-aba="${a}">${ROTULO_ABA[a]||a}</button>`
  ).join('');
  nav.querySelectorAll('.aba').forEach(b=> b.onclick = ()=>{ S.aba=b.dataset.aba; desenhar(); });

  const c = document.getElementById('conteudo');
  if(S.aba==='ANEXAR') c.innerHTML = telaAnexar();
  else if(S.aba==='FUNCIONARIOS') c.innerHTML = telaFuncionarios();
  else if(S.aba==='EX_FUNCIONARIOS') c.innerHTML = telaEx();
  else if(S.aba==='PENDENCIAS') c.innerHTML = telaPendencias();
  else if(S.aba==='HORAS_EXTRAS') c.innerHTML = telaHorasExtras();
  else if(S.aba==='COMISSOES') c.innerHTML = telaComissoes();
  else if(S.aba==='CONTABILIDADE') c.innerHTML = telaContabilidade();
  else if(S.aba==='FOLHA') c.innerHTML = telaFolha();
  ligarEventos();
  if(S.aba==='ANEXAR') ligarAnexar();
  if(S.aba==='HORAS_EXTRAS') ligarHorasExtras();
  if(S.aba==='COMISSOES') ligarComissoes();
  if(S.aba==='CONTABILIDADE') ligarContabilidade();
  if(S.aba==='FOLHA') ligarFolha();
}

function barraFiltros(comBotao){
  const ops = ['<option value="TODAS">Todas as filiais</option>']
    .concat(S.filiais.map(f=>`<option value="${esc(f.nome)}" ${S.filtroFilial===f.nome?'selected':''}>${esc(f.nome)}</option>`));
  return `
  <div class="barra">
    <div class="busca">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>
      <input id="campoBusca" placeholder="Buscar funcionário pelo nome" value="${esc(S.busca)}">
    </div>
    <select class="campo" id="campoFilial">${ops.join('')}</select>
    ${comBotao&&podeImportar()?'<button class="btn sec" id="btnImportar">Importar planilha</button>':''}
    ${comBotao?'<button class="btn" id="btnNovo">Cadastrar funcionário</button>':''}
  </div>`;
}

function filtrar(lista){
  const b = S.busca.trim().toUpperCase();
  return lista.filter(f=>
    (S.filtroFilial==='TODAS' || f.filial===S.filtroFilial) &&
    (!b || f.nome.toUpperCase().includes(b))
  );
}

/* ---------- ABA 1: FUNCIONÁRIOS ---------- */
function telaFuncionarios(){
  const ativos = filtrar(S.funcionarios.filter(f=>f.status!=='DEMITIDO'))
    .sort((a,b)=> (a.filial||'').localeCompare(b.filial||'','pt-BR',{numeric:true})
                  || a.nome.localeCompare(b.nome,'pt-BR'));

  let html = barraFiltros(true);
  const cont = {vermelho:0, ambar:0, verde:0, neutro:0};
  ativos.forEach(f=> cont[situacao(f)]++);

  html += `<div class="aviso info" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
    <span>Competência <b>${compBonita(S.competencia)}</b> · prazo <b>${dataBonita(prazoDaCompetencia())}</b></span>
    <span style="margin-left:auto;display:flex;gap:14px;font-size:12px">
      <span style="color:var(--vermelho)"><b>${cont.vermelho}</b> falta documento</span>
      <span style="color:var(--ambar)"><b>${cont.ambar}</b> a conferir</span>
      <span style="color:var(--verde)"><b>${cont.verde}</b> conferido</span>
      <span style="color:var(--apagado)"><b>${ativos.length}</b> no total</span>
    </span>
  </div>`;

  if(!ativos.length) return html + vazio('Nenhum funcionário encontrado',
    'Cadastre o primeiro funcionário ou ajuste a busca.');

  let filialAnterior = null;
  const corpo = ativos.map(f=>{
    const espaco = (filialAnterior !== null && f.filial !== filialAnterior)
      ? '<tr class="espaco-filial"><td colspan="10"></td></tr>' : '';
    filialAnterior = f.filial;
    return espaco + linhaFuncionario(f);
  }).join('');

  html += `<div class="painel" style="padding:0"><div class="rolagem-alta">
    <table class="tab-func"><thead><tr>
      <th>Filial</th><th>Funcionário</th><th>Cargo</th><th>Início</th><th>Admissão</th>
      <th>Dados bancários</th><th>Situação</th><th colspan="2"></th><th>Observações</th>
    </tr></thead><tbody>${corpo}</tbody></table></div></div>`;
  return html;
}

function bancoResumido(f){
  const p = [];
  if(f.banco) p.push(esc(f.banco));
  if(f.agencia) p.push('ag '+esc(f.agencia));
  if(f.conta) p.push((f.tipoConta==='POUPANCA'?'poup. ':'c/c ')+esc(f.conta));
  return p.length ? p.join(' ') : '<span class="d-falta">sem dados</span>';
}

function linhaFuncionario(f){
  const cor = situacao(f);
  const meus = docsDe(f.id, S.competencia);
  const faltam = S.config.tiposObrigatorios.filter(t=>!meus.find(d=>d.tipo===t));
  const nota = cor==='vermelho' ? 'Falta: '+faltam.join(', ')
    : cor==='ambar' ? 'Anexado · aguardando conferência do RH'
    : cor==='verde' ? 'Documentos conferidos'
    : 'Sem obrigação nesta competência';
  const fil = S.filiais.find(x=>x.nome===f.filial);
  const dica = [f.cpf?'CPF '+f.cpf:'', fil&&fil.cnpj?'CNPJ '+fil.cnpj:''].filter(Boolean).join(' · ');

  return `<tr>
    <td class="t-filial">${esc(f.filial||'—')}</td>
    <td class="t-nome" title="${esc(nota)}">
      <span class="bolinha p-${cor}"></span><span class="c-${cor}">${esc(f.nome)}</span></td>
    <td class="t-apagado">${esc(f.cargo||'—')}</td>
    <td class="mono t-apagado">${dataBonita(f.dataInicio)}</td>
    <td class="mono">${dataBonita(f.dataAdmissao)}</td>
    <td class="t-banco mono" title="${esc(dica)}">${bancoResumido(f)}</td>
    <td>${selo(f.status)}</td>
    <td><button class="btn sec mini" data-docs="${f.id}">Documentos</button></td>
    <td><button class="btn sec mini" data-editar="${f.id}" title="Editar cadastro" aria-label="Editar cadastro">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></td>
    <td class="t-obs" title="${esc(f.observacoes||'')}">${esc(f.observacoes||'')}</td>
  </tr>`;
}

/* ---------- ABA 2: EX-FUNCIONÁRIOS ---------- */
function telaEx(){
  const ex = filtrar(S.funcionarios.filter(f=>f.status==='DEMITIDO'));
  let html = barraFiltros(false);
  if(!ex.length) return html + vazio('Nenhum ex-funcionário',
    'Ao alterar o status de alguém para Demitido, o nome aparece aqui.');

  /* agrupado por filial; dentro de cada uma, em ordem alfabética */
  const grupos = {};
  ex.forEach(f=>{ (grupos[f.filial||'SEM FILIAL'] = grupos[f.filial||'SEM FILIAL']||[]).push(f); });
  const filiais = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));

  filiais.forEach(fil=>{
    const lista = grupos[fil].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    html += `
    <section class="filial">
      <div class="filial-topo">
        <div>
          <div class="filial-nome">${esc(fil)}</div>
          <div class="filial-qtd">${lista.length} ${lista.length===1?'ex-funcionário':'ex-funcionários'} em ordem alfabética</div>
        </div>
      </div>
      ${lista.map(f=>`
      <div class="linha-func">
        <div class="marcador m-neutro"></div>
        <div class="nome c-neutro">${esc(f.nome)}<small>Admissão ${dataBonita(f.dataAdmissao)} · Demissão ${dataBonita(f.dataDemissao)}</small></div>
        <div class="cel esconde-mob">${esc(f.filial)}</div>
        <div class="cel mono esconde-mob">${dataBonita(f.dataDemissao)}</div>
        <div class="esconde-mob">${selo('DEMITIDO')}</div>
        <div class="acoes">
          <button class="btn sec mini" data-docs="${f.id}">Documentos</button>
          <button class="btn sec mini" data-editar="${f.id}">Editar</button>
        </div>
      </div>`).join('')}
    </section>`;
  });
  return html;
}

/* ---------- ABA 3: PENDÊNCIAS ---------- */
function telaPendencias(){
  const ativos = S.funcionarios.filter(f=>f.status!=='DEMITIDO');
  const tipos = S.config.tiposObrigatorios;
  const filiais = [...new Set(ativos.map(f=>f.filial))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
  let html = `<div class="aviso info">Faltas por filial na competência <b>${compBonita(S.competencia)}</b> ·
    prazo até <b>${dataBonita(prazoDaCompetencia())}</b> · clique numa filial para ver quem está devendo</div>`;
  if(!filiais.length) return html + vazio('Sem dados','Cadastre funcionários para acompanhar as pendências.');

  html += `<div class="painel"><table class="matriz"><thead><tr>
    <th>Filial</th>${tipos.map(t=>`<th>${esc(t)}</th>`).join('')}<th>A conferir</th></tr></thead><tbody>`;

  filiais.forEach(fil=>{
    const lista = ativos.filter(f=>f.filial===fil);
    const cels = tipos.map(t=>{
      const falta = lista.filter(f=>!docsDe(f.id,S.competencia).find(d=>d.tipo===t)).length;
      return `<td class="${falta?'cel-falta':'cel-ok'}">${falta? falta+' falta'+(falta>1?'m':''):'ok'}</td>`;
    }).join('');
    const conferir = lista.filter(f=>situacao(f)==='ambar').length;
    const aberta = S.pendAberta === fil;
    html += `<tr class="linha-pend ${aberta?'aberta':''}" data-pend="${esc(fil)}">
      <td><span class="seta">${aberta?'▾':'▸'}</span> ${esc(fil)}
        <span style="color:var(--apagado);font-weight:400">(${lista.length})</span></td>
      ${cels}<td class="${conferir?'cel-falta':'cel-ok'}">${conferir||'ok'}</td></tr>`;

    if(aberta) html += detalhePendencia(fil, lista, tipos);
  });
  html += '</tbody></table></div>';
  return html;
}

function detalhePendencia(fil, lista, tipos){
  const devendo = lista.map(f=>{
    const meus = docsDe(f.id, S.competencia);
    const faltam = tipos.filter(t=>!meus.find(d=>d.tipo===t));
    const conferir = meus.filter(d=>tipos.includes(d.tipo) && d.status!=='APROVADO');
    return {f, faltam, conferir};
  }).filter(x=> x.faltam.length || x.conferir.length)
    .sort((a,b)=> b.faltam.length - a.faltam.length || a.f.nome.localeCompare(b.f.nome,'pt-BR'));

  if(!devendo.length){
    return `<tr class="detalhe-pend"><td colspan="${tipos.length+2}">
      <div class="cx-pend" style="color:var(--verde)">Tudo anexado e conferido em ${esc(fil)}.</div></td></tr>`;
  }

  return `<tr class="detalhe-pend"><td colspan="${tipos.length+2}">
    <div class="cx-pend">
      ${devendo.map(x=>`
      <div class="linha-pend-func">
        <span class="bolinha p-${situacao(x.f)}"></span>
        <b>${esc(x.f.nome)}</b>
        ${x.faltam.length ? `<span class="pend-falta">falta ${x.faltam.map(esc).join(', ')}</span>` : ''}
        ${x.conferir.length ? `<span class="pend-conferir">a conferir ${x.conferir.map(d=>esc(d.tipo)).join(', ')}</span>` : ''}
        <button class="btn sec mini" data-docs="${x.f.id}" style="margin-left:auto">Documentos</button>
      </div>`).join('')}
    </div></td></tr>`;
}

function vazio(t,s){ return `<div class="filial"><div class="vazio"><b>${esc(t)}</b>${esc(s)}</div></div>`; }

function ligarEventos(){
  const busca = document.getElementById('campoBusca');
  if(busca){
    busca.oninput = e=>{
      S.busca = e.target.value;
      const pos = e.target.selectionStart;
      desenhar();
      const novo = document.getElementById('campoBusca');
      if(novo){ novo.focus(); novo.setSelectionRange(pos,pos); }
    };
  }
  const fil = document.getElementById('campoFilial');
  if(fil) fil.onchange = e=>{ S.filtroFilial = e.target.value; desenhar(); };
  const novo = document.getElementById('btnNovo');
  if(novo) novo.onclick = ()=>abrirFuncionario(null);
  const imp = document.getElementById('btnImportar');
  if(imp) imp.onclick = abrirImportacao;
  document.querySelectorAll('[data-docs]').forEach(b=> b.onclick = e=>{
    e.stopPropagation(); abrirDocumentos(b.dataset.docs);
  });
  document.querySelectorAll('[data-pend]').forEach(tr=> tr.onclick = ()=>{
    S.pendAberta = S.pendAberta===tr.dataset.pend ? null : tr.dataset.pend;
    desenhar();
  });
  document.querySelectorAll('[data-editar]').forEach(b=> b.onclick = ()=>abrirFuncionario(b.dataset.editar));
}

/* ==================================================================
   MODAIS — base
   ================================================================== */
function modal(html, larga){
  const el = document.createElement('div');
  el.className='fundo';
  el.innerHTML = `<div class="modal ${larga?'larga':''}">${html}</div>`;
  el.addEventListener('mousedown', e=>{ if(e.target===el) el.remove(); });
  document.getElementById('modais').appendChild(el);
  const f = el.querySelector('.fechar');
  if(f) f.onclick = ()=>el.remove();
  document.addEventListener('keydown', function fechaEsc(ev){
    if(ev.key==='Escape'){ el.remove(); document.removeEventListener('keydown', fechaEsc); }
  });
  return el;
}

/* ==================================================================
   CADASTRO DE FUNCIONÁRIO
   ================================================================== */
function abrirFuncionario(id, extra){
  const f = id ? S.funcionarios.find(x=>x.id===id)
    : Object.assign({nome:'',filial:'',cargo:'',dataAdmissao:'',dataInicio:'',dataDemissao:'',
                     status:'EMPREGADO',observacoes:'',cpf:'',banco:'',agencia:'',conta:'',
                     tipoConta:'CORRENTE', recebeVale:'SIM'},
                    (extra && extra.inicial) || {});
  const ops = S.filiais.map(x=>`<option value="${esc(x.nome)}" ${f.filial===x.nome?'selected':''}>${esc(x.nome)}</option>`).join('');
  const el = modal(`
    <div class="modal-topo">
      <div><small>${id?'Editar cadastro':'Novo funcionário'}</small><h2>${id?esc(f.nome):'Cadastrar funcionário'}</h2></div>
      <button class="fechar" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-corpo">
      <div id="fErro"></div>
      ${(extra && extra.aviso) ? `<div class="aviso info">${esc(extra.aviso)}</div>` : ''}
      <div class="grade">
        <div class="full"><label class="campo-lbl" for="fNome">Nome completo</label>
          <input class="entrada" id="fNome" value="${esc(f.nome)}" placeholder="Nome como consta no holerite"></div>
        <div><label class="campo-lbl" for="fFilial">Filial</label>
          <select class="entrada" id="fFilial"><option value="">Selecione</option>${ops}</select></div>
        <div><label class="campo-lbl" for="fCargo">Cargo</label>
          <input class="entrada" id="fCargo" value="${esc(f.cargo)}"></div>
        <div><label class="campo-lbl" for="fAdm">Data de admissão</label>
          <input class="entrada" type="date" id="fAdm" value="${esc(f.dataAdmissao)}"></div>
        <div><label class="campo-lbl" for="fIni">Início</label>
          <input class="entrada" type="date" id="fIni" value="${esc(f.dataInicio||'')}"></div>
        <div><label class="campo-lbl" for="fStatus">Situação</label>
          <select class="entrada" id="fStatus">
            ${Object.keys(SITUACOES).map(k=>
              `<option value="${k}" ${f.status===k?'selected':''}>${SITUACOES[k].rotulo}</option>`).join('')}
          </select></div>
        <div id="boxDem" style="display:${f.status==='DEMITIDO'?'block':'none'}">
          <label class="campo-lbl" for="fDem">Data de demissão</label>
          <input class="entrada" type="date" id="fDem" value="${esc(f.dataDemissao)}"></div>
      </div>

      <div class="titulo-grupo">Dados bancários e documento</div>
      <div class="grade">
        <div><label class="campo-lbl" for="fCpf">CPF</label>
          <input class="entrada mono" id="fCpf" value="${esc(f.cpf||'')}" placeholder="000.000.000-00"></div>
        <div><label class="campo-lbl" for="fBanco">Banco</label>
          <input class="entrada" id="fBanco" value="${esc(f.banco||'')}" placeholder="Nome ou número do banco"></div>
        <div><label class="campo-lbl" for="fAgencia">Agência</label>
          <input class="entrada mono" id="fAgencia" value="${esc(f.agencia||'')}"></div>
        <div>
          <label class="campo-lbl" for="fConta">Conta</label>
          <div style="display:flex;gap:8px">
            <input class="entrada mono" id="fConta" value="${esc(f.conta||'')}" placeholder="Com dígito" style="flex:1">
            <select class="entrada" id="fTipoConta" style="width:120px;flex:none">
              <option value="CORRENTE" ${f.tipoConta!=='POUPANCA'?'selected':''}>Corrente</option>
              <option value="POUPANCA" ${f.tipoConta==='POUPANCA'?'selected':''}>Poupança</option>
            </select>
          </div>
        </div>
        <div><label class="campo-lbl" for="fVale">Recebe vale mensal</label>
          <select class="entrada" id="fVale">
            <option value="SIM" ${f.recebeVale!=='NAO'?'selected':''}>Sim</option>
            <option value="NAO" ${f.recebeVale==='NAO'?'selected':''}>Não</option>
          </select></div>
        <div class="full" id="boxCnpj"></div>
        <div class="full"><label class="campo-lbl" for="fObs">Observações</label>
          <textarea class="entrada" id="fObs" placeholder="Anotações internas do RH">${esc(f.observacoes)}</textarea></div>
      </div>
    </div>
    <div class="modal-pe">
      ${id && ehMaster() ? '<button class="btn perigo" id="fExcluir" style="margin-right:auto">Excluir funcionário</button>':''}
      <button class="btn sec" id="fCancelar">Cancelar</button>
      <button class="btn" id="fSalvar">Salvar</button>
    </div>`);

  const st = el.querySelector('#fStatus');
  st.onchange = ()=> el.querySelector('#boxDem').style.display = st.value==='DEMITIDO'?'block':'none';

  const mostrarCnpj = ()=>{
    const fil = S.filiais.find(x=>x.nome===el.querySelector('#fFilial').value);
    el.querySelector('#boxCnpj').innerHTML = fil ? `
      <label class="campo-lbl">CNPJ da filial ${esc(fil.nome)}</label>
      <div class="mono" style="padding:9px 0;color:var(--apagado)">${esc(fil.cnpj || 'não cadastrado — informe na engrenagem → Filiais')}</div>` : '';
  };
  el.querySelector('#fFilial').addEventListener('change', mostrarCnpj);
  mostrarCnpj();
  el.querySelector('#fCancelar').onclick = ()=>el.remove();

  el.querySelector('#fSalvar').onclick = async ()=>{
    const dados = {
      id: id||'',
      nome: el.querySelector('#fNome').value.trim(),
      filial: el.querySelector('#fFilial').value,
      cargo: el.querySelector('#fCargo').value.trim(),
      dataAdmissao: el.querySelector('#fAdm').value,
      dataInicio: el.querySelector('#fIni').value,
      cpf: el.querySelector('#fCpf').value.trim(),
      banco: el.querySelector('#fBanco').value.trim(),
      agencia: el.querySelector('#fAgencia').value.trim(),
      conta: el.querySelector('#fConta').value.trim(),
      tipoConta: el.querySelector('#fTipoConta').value,
      recebeVale: el.querySelector('#fVale').value,
      status: st.value,
      dataDemissao: st.value==='DEMITIDO' ? el.querySelector('#fDem').value : '',
      observacoes: el.querySelector('#fObs').value
    };
    if(!dados.nome || !dados.filial){
      el.querySelector('#fErro').innerHTML = '<div class="aviso erro">Informe o nome completo e a filial.</div>'; return;
    }
    if(dados.status==='DEMITIDO' && !dados.dataDemissao){
      el.querySelector('#fErro').innerHTML = '<div class="aviso erro">Informe a data de demissão.</div>'; return;
    }
    carregando(true);
    try{
      const r = await api('salvarFuncionario', {funcionario:dados});
      el.remove();
      await recarregar();
      if(extra && extra.aoSalvar) extra.aoSalvar(r.id);
      toast(dados.status==='DEMITIDO' ? 'Funcionário movido para Ex-funcionários.'
            : dados.status==='EMPREGADO' ? 'Cadastro salvo.'
            : 'Situação alterada para '+SITUACOES[dados.status].rotulo+'. Continua na aba Funcionários.');
    }catch(e){ toast(e.message,true); }
    finally{ carregando(false); }
  };

  const ex = el.querySelector('#fExcluir');
  if(ex) ex.onclick = async ()=>{
    if(!confirm('Excluir '+f.nome+' e todos os documentos dele no Drive? Esta ação não pode ser desfeita.')) return;
    carregando(true);
    try{ await api('excluirFuncionario',{id}); el.remove(); await recarregar(); toast('Funcionário excluído.'); }
    catch(e){ toast(e.message,true); } finally{ carregando(false); }
  };
}

/* ==================================================================
   DOCUMENTOS
   ================================================================== */
async function abrirDocumentos(funcId){
  const f = S.funcionarios.find(x=>x.id===funcId);
  S.docsFunc = f; S.selecao = new Set();
  carregando(true);
  try{ S.docsLista = await api('listarDocumentos',{funcionarioId:funcId, competencia:S.competencia}); }
  catch(e){ carregando(false); return toast(e.message,true); }
  carregando(false);

  const el = modal(`
    <div class="modal-topo">
      <div><small>Documentos</small><h2>${esc(f.nome)}</h2></div>
      <button class="fechar" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-corpo" id="docsCorpo"></div>
    <div class="modal-pe">
      <button class="btn sec" id="expSel" style="margin-right:auto">Exportar selecionados em PDF</button>
      <button class="btn sec" id="expTudo">Exportar tudo em PDF</button>
      ${podeAprovar()?'<button class="btn" id="aprovarTudo">Aprovar mês inteiro</button>':''}
    </div>`, true);

  el._func = f;
  desenharDocs(el);

  el.querySelector('#expSel').onclick = ()=>{
    const sel = S.docsLista.filter(d=>S.selecao.has(d.id));
    if(!sel.length) return toast('Selecione ao menos um documento.', true);
    exportarPdf(sel, f);
  };
  el.querySelector('#expTudo').onclick = ()=>{
    if(!S.docsLista.length) return toast('Não há documentos para exportar.', true);
    exportarPdf(S.docsLista.slice(), f, true);
  };
  const ap = el.querySelector('#aprovarTudo');
  if(ap) ap.onclick = async ()=>{
    const ids = S.docsLista.filter(d=>d.competencia===S.competencia && d.status!=='APROVADO').map(d=>d.id);
    if(!ids.length) return toast('Nada pendente de aprovação nesta competência.');
    carregando(true);
    try{
      await api('aprovarDocumento',{ids, aprovar:true});
      S.docsLista.forEach(d=>{ if(ids.includes(d.id)) d.status='APROVADO'; });
      sincronizarDocs();
      desenharDocs(el); desenhar();
      toast('Documentos de '+compBonita(S.competencia)+' aprovados.');
    }catch(e){ toast(e.message,true); } finally{ carregando(false); }
  };
}

function sincronizarDocs(){
  S.documentos = S.documentos.filter(d=>d.funcionarioId!==S.docsFunc.id)
    .concat(S.docsLista.filter(d=>d.competencia===S.competencia));
}

function desenharDocs(el){
  const f = el._func;
  const comp = S.competencia;
  const tipos = S.config.tiposObrigatorios;
  const opcionais = S.config.tiposOpcionais;
  const doMes = S.docsLista.filter(d=>d.competencia===comp);
  const extras = doMes.filter(d=>!tipos.includes(d.tipo) && !opcionais.includes(d.tipo));
  const outros = S.docsLista.filter(d=>d.competencia!==comp)
    .sort((a,b)=> b.competencia.localeCompare(a.competencia));

  let html = `
    <div class="docs-cabecalho">
      <div>
        <div class="campo-lbl" style="margin:0 0 2px">Competência</div>
        <div class="mono" style="font-size:16px;font-weight:700">${compBonita(comp)}</div>
      </div>
      <div class="prazo">Prazo para anexar: <b>${dataBonita(prazoDaCompetencia())}</b><br>
        Filial <b>${esc(f.filial)}</b> · Admissão <b>${dataBonita(f.dataAdmissao)}</b></div>
      <div style="margin-left:auto" class="prazo">Troque o mês no topo da tela para anexar outra competência.</div>
    </div>
    <div class="colunas-docs">
    <div>
    <div class="titulo-grupo" style="margin-top:0">Obrigatórios do mês</div>
    <div class="grade-docs">`;

  tipos.forEach(t=>{
    html += cardDoc(t, doMes.find(d=>d.tipo===t), f);
  });
  html += `</div></div>`;

  html += `<div>
    <div class="titulo-grupo" style="margin-top:0">Opcionais<small>fora da cor do nome</small></div>
    <div class="grade-docs">`;
  opcionais.forEach(t=>{
    html += cardDoc(t, doMes.find(d=>d.tipo===t), f, true);
  });
  extras.forEach(d=> html += cardDoc(d.tipo, d, f, true));
  html += `
      <div class="card-doc falta">
        <div class="card-doc-topo"><span class="ponto" style="background:#c8ccd3"></span><span class="card-doc-tipo">OUTRO</span></div>
        <div class="miniatura sem">Documento avulso</div>
        <div class="card-doc-pe"><button class="link-acao" id="addOutro">+ Adicionar</button></div>
      </div>
    </div></div></div>`;

  if(outros.length){
    html += `<div class="hist-comp"><div class="hist-titulo">Outras competências</div>`;
    let compAtual = '';
    outros.forEach(d=>{
      if(d.competencia!==compAtual){
        compAtual = d.competencia;
        html += `<div class="hist-titulo mono" style="margin-top:12px;color:var(--tinta)">${compBonita(compAtual)}</div>`;
      }

function ligarEventosDocs(el){
  el.querySelectorAll('.chk').forEach(c=>{
    c.onclick = ev=>{ ev.stopPropagation(); c.checked ? S.selecao.add(c.dataset.id) : S.selecao.delete(c.dataset.id); };
  });
  el.querySelectorAll('[data-ver]').forEach(b=> b.onclick = e=>{
    if(e.target.classList.contains('chk')) return;
    verDocumento(b.dataset.ver);
  });
  el.querySelectorAll('[data-anexar]').forEach(b=> b.onclick = ()=>anexar(el, b.dataset.anexar));
  const outro = el.querySelector('#addOutro');
  if(outro) outro.onclick = ()=>{
    const t = prompt('Nome do documento (ex.: ATESTADO, ADVERTÊNCIA):');
    if(t && t.trim()) anexar(el, t.trim().toUpperCase());
  };
  el.querySelectorAll('[data-aprovar]').forEach(b=> b.onclick = ()=>mudarAprovacao(el, b.dataset.aprovar, true));
  el.querySelectorAll('[data-reprovar]').forEach(b=> b.onclick = ()=>mudarAprovacao(el, b.dataset.reprovar, false));
  el.querySelectorAll('[data-excluir]').forEach(b=> b.onclick = ()=>excluirDoc(el, b.dataset.excluir));
  el.querySelectorAll('[data-baixar]').forEach(b=> b.onclick = ()=>{
    const d = S.docsLista.find(x=>x.id===b.dataset.baixar);
    exportarPdf([d], el._func);
  });
  /* documentos anexados antes da miniatura existir: baixa a imagem sob demanda */
  S.docsLista.filter(d=> d.competencia===S.competencia && !d.miniatura
                         && d.mimeType!=='application/pdf').forEach(async d=>{
    const alvo = el.querySelector('#mini-'+d.id);
    if(!alvo) return;
    try{
      const url = await urlArquivo(d.id);
      alvo.innerHTML = `<img src="${url}" alt="${esc(d.tipo)}">`;
    }catch(e){ alvo.innerHTML = '<span class="pdf-marca">Erro</span>'; }
  });
}

/* ---------- UPLOAD ---------- */
function anexar(el, tipo){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*,application/pdf';
  inp.onchange = async ()=>{
    const arq = inp.files[0];
    if(!arq) return;
    carregando(true);
    try{
      const pronto = await prepararArquivo(arq);
      const doc = await api('enviarDocumento', {
        funcionarioId: S.docsFunc.id, tipo, competencia: S.competencia,
        mimeType: pronto.mime, dados: pronto.base64, miniatura: pronto.miniatura
      });
      doc.miniatura = pronto.miniatura;
      /* o servidor já devolveu o documento salvo: atualiza em memória
         em vez de baixar a lista toda de novo */
      S.docsLista = S.docsLista.filter(d=>
        !(d.tipo===doc.tipo && d.competencia===doc.competencia));
      S.docsLista.push(doc);
      sincronizarDocs(); desenharDocs(el); desenhar();
      toast(tipo+' de '+compBonita(S.competencia)+' anexado.');
    }catch(e){ toast(e.message,true); } finally{ carregando(false); }
  };
  inp.click();
}

function desenhaEmCanvas(fonte, largura, altura, qualidade){
  const cv = document.createElement('canvas');
  cv.width = largura; cv.height = altura;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,largura,altura);
  ctx.drawImage(fonte, 0, 0, largura, altura);
  return cv.toDataURL('image/jpeg', qualidade).split(',')[1];
}

function medidas(w, h, max){
  const f = Math.min(1, max/Math.max(w,h));
  return [Math.max(1,Math.round(w*f)), Math.max(1,Math.round(h*f))];
}

/* Gera o arquivo que vai para o Drive e, junto, uma miniatura leve.
   A miniatura fica guardada na planilha e volta com a lista de documentos,
   então a tela abre sem baixar as imagens grandes uma a uma. */
async function prepararArquivo(arq){
  if(arq.type==='application/pdf'){
    const base64 = await lerBase64(arq);
    let miniatura = '';
    try{ miniatura = await miniaturaDoPdf(await arq.arrayBuffer()); }catch(e){}
    return {mime:'application/pdf', base64, miniatura};
  }
  const img = await carregarImagem(arq);
  const [w,h] = medidas(img.width, img.height, 1800);
  const [mw,mh] = medidas(img.width, img.height, 300);
  return {
    mime:'image/jpeg',
    base64: desenhaEmCanvas(img, w, h, 0.84),
    miniatura: desenhaEmCanvas(img, mw, mh, 0.6)
  };
}

async function miniaturaDoPdf(buffer){
  await usar('pdfjs');
  const pdf = await pdfjsLib.getDocument({data:buffer}).promise;
  const pg = await pdf.getPage(1);
  const base = pg.getViewport({scale:1});
  const vp = pg.getViewport({scale: 300/Math.max(base.width, base.height)});
  const cv = document.createElement('canvas');
  cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:ctx, viewport:vp}).promise;
  return cv.toDataURL('image/jpeg', 0.6).split(',')[1];
}

function lerBase64(arq){
  return new Promise((ok,err)=>{
    const r = new FileReader();
    r.onload = ()=>ok(r.result.split(',')[1]);
    r.onerror = ()=>err(new Error('Não foi possível ler o arquivo.'));
    r.readAsDataURL(arq);
  });
}
function carregarImagem(arq){
  return new Promise((ok,err)=>{
    const img = new Image();
    img.onload = ()=>ok(img);
    img.onerror = ()=>err(new Error('Arquivo de imagem inválido.'));
    img.src = URL.createObjectURL(arq);
  });
}

/* ---------- VISUALIZADOR ---------- */
async function urlArquivo(id){
  if(S.cacheArquivo[id]) return S.cacheArquivo[id].url;
  const a = await api('baixarArquivo',{id});
  const bytes = b64Bytes(a.dados);
  const blob = new Blob([bytes], {type:a.mimeType});
  const url = URL.createObjectURL(blob);
  S.cacheArquivo[id] = {url, bytes, mime:a.mimeType, nome:a.nome};
  return url;
}
function b64Bytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}

/* ---------- EXPORTAÇÃO EM PDF ---------- */
async function exportarPdf(docs, func, tudo){
  carregando(true);
  try{
    await usar('pdflib');
    const {PDFDocument, StandardFonts, rgb} = PDFLib;
    const saida = await PDFDocument.create();
    const fonte = await saida.embedFont(StandardFonts.Helvetica);
    const fonteB = await saida.embedFont(StandardFonts.HelveticaBold);
    const logo = await saida.embedPng(b64Bytes(LOGO_ESCURA));

    docs = docs.slice().sort((a,b)=>
      a.competencia===b.competencia ? a.tipo.localeCompare(b.tipo) : a.competencia.localeCompare(b.competencia));

    for(const d of docs){
      await urlArquivo(d.id);
      const {bytes, mime} = S.cacheArquivo[d.id];
      if(mime==='application/pdf'){
        try{
          const origem = await PDFDocument.load(bytes, {ignoreEncryption:true});
          const pgs = await saida.copyPages(origem, origem.getPageIndices());
          pgs.forEach(p=>saida.addPage(p));
          continue;
        }catch(e){ /* PDF ilegível: segue para a próxima */ continue; }
      }
      const img = mime==='image/png' ? await saida.embedPng(bytes) : await saida.embedJpg(bytes);
      const L=595.28, A=841.89, margem=32, topo=104;
      const pg = saida.addPage([L,A]);
      const logoH = 17, logoW = logo.width*logoH/logo.height;
      pg.drawImage(logo, {x:margem, y:A-40, width:logoW, height:logoH});
      pg.drawText(d.tipo+'  '+compBonita(d.competencia), {x:margem, y:A-68, size:14, font:fonteB, color:rgb(.06,.07,.08)});
      pg.drawText(func.nome+'  ·  '+(func.filial||''), {x:margem, y:A-83, size:9, font:fonte, color:rgb(.42,.45,.5)});
      pg.drawLine({start:{x:margem, y:A-93}, end:{x:L-margem, y:A-93}, thickness:.6, color:rgb(.86,.88,.9)});
      const dispW = L-margem*2, dispH = A-topo-margem;
      const razao = Math.min(dispW/img.width, dispH/img.height);
      const w = img.width*razao, h = img.height*razao;
      pg.drawImage(img, {x:(L-w)/2, y:margem+(dispH-h)/2, width:w, height:h});
    }

    if(!saida.getPageCount()) throw new Error('Nenhum documento pôde ser convertido.');
    const bytes = await saida.save();
    let nome;
    if(docs.length===1){
      nome = docs[0].tipo+' '+compArquivo(docs[0].competencia)+'.pdf';
    }else if(tudo){
      nome = func.nome+' - DOCUMENTOS.pdf';
    }else{
      const comps = [...new Set(docs.map(d=>d.competencia))];
      nome = func.nome+' - DOCUMENTOS'+(comps.length===1?' '+compArquivo(comps[0]):'')+'.pdf';
    }
    baixar(new Blob([bytes],{type:'application/pdf'}), nome);
    toast('PDF gerado: '+nome);
  }catch(e){ toast(e.message,true); }
  finally{ carregando(false); }
}

function baixar(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ==================================================================
   ABA COMISSÕES
   Meta diária por funcionário e o registro dos dias em que ela foi
   batida. O total do mês alimenta a coluna COMISSÕES da contabilidade.
   ================================================================== */
function funcionariosDaComissao(){
  return S.funcionarios
    .filter(f=>f.status!=='DEMITIDO')
    .filter(f=> S.filtroFilial==='TODAS' || f.filial===S.filtroFilial)
    .filter(f=> !S.busca.trim() || f.nome.toUpperCase().includes(S.busca.trim().toUpperCase()))
    .sort((a,b)=> (a.filial||'').localeCompare(b.filial||'','pt-BR',{numeric:true})
                  || a.nome.localeCompare(b.nome,'pt-BR'));
}
function batidasDe(funcId){
  return S.com.dias.filter(d=>d.funcionarioId===funcId)
    .sort((a,b)=> String(a.data).localeCompare(String(b.data)));
}
function totalBatidas(funcId){
  return batidasDe(funcId).reduce((s,d)=>s+valorNum(d.valor), 0);
}

function telaComissoes(){
  if(S.com.competencia !== S.competencia){

    return `<div class="filial"><div class="vazio">Carregando as comissões de ${compBonita(S.competencia)}…</div></div>`;
  }
  const lista = funcionariosDaComissao();
  const ops = ['<option value="TODAS">Todas as filiais</option>']
    .concat(S.filiais.map(f=>`<option value="${esc(f.nome)}" ${S.filtroFilial===f.nome?'selected':''}>${esc(f.nome)}</option>`));

  let html = `
  <div class="barra">
    <div class="busca">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>
      <input id="campoBusca" placeholder="Buscar funcionário pelo nome" value="${esc(S.busca)}">
    </div>
    <select class="campo" id="campoFilial">${ops.join('')}</select>
    <div style="display:flex;gap:6px;align-items:flex-end">
      <div><label class="campo-lbl" for="comMeta">Meta diária</label>

               placeholder="0,00" style="width:96px"></div>
      <button class="btn sec" id="comAplicar">Aplicar a todos</button>
    </div>
    <button class="btn sec" id="comExcel">Excel</button>
    <button class="btn" id="comSalvar">Salvar metas</button>
  </div>

    Comissões de <b>${compBonita(S.competencia)}</b>. Defina a meta diária de cada um e,
    a cada dia batido, clique em <b>Dias batidos</b> para lançar a data e o valor.
    O total do mês vai direto para a coluna COMISSÕES da aba Contabilidade.
  </div>`;

  if(!lista.length) return html + vazio('Nenhum funcionário ativo','Ajuste a busca ou o filtro de filial.');

  html += `<div class="painel" style="padding:0"><div class="rolagem">
    <table class="tab-folha"><thead><tr>

      <th style="width:110px">Dias batidos</th><th style="width:130px">Total do mês</th><th style="width:130px"></th>
    </tr></thead><tbody>
    ${lista.map(f=>{
      const m = S.com.metas[f.id] || {};
      const qtd = batidasDe(f.id).length;
      const tot = totalBatidas(f.id);
      return `<tr>
        <td class="t-nome">${esc(f.nome)}</td>
        <td class="t-apagado">${esc(f.filial||'—')}</td>

                   value="${esc(m.metaDiaria||'')}" placeholder="0,00"></td>

async function carregarComissoes(){
  carregando(true);
  try{
    const d = await api('listarComissoes', {competencia:S.competencia});
    S.com.metas = {};
    d.metas.forEach(m=>{ S.com.metas[m.funcionarioId] = m; });
    S.com.dias = d.dias;
    S.com.competencia = S.competencia;
    desenhar();
  }catch(e){ toast(e.message, true); }
  finally{ carregando(false); }
}

function ligarComissoes(){
  document.querySelectorAll('.cel-com').forEach(c=>{
    c.oninput = ()=>{
      const m = S.com.metas[c.dataset.f] || (S.com.metas[c.dataset.f] = {funcionarioId:c.dataset.f});
      m[c.dataset.campo] = c.value;
    };
    c.onblur = ()=>{ if(c.value.trim()){
      c.value = moeda(valorNum(c.value));
      S.com.metas[c.dataset.f][c.dataset.campo] = c.value;
    }};
  });
  const b = id => document.getElementById(id);
  if(b('comMeta')) b('comMeta').oninput = e=>{ S.com.metaPadrao = e.target.value; };
  if(b('comAplicar')) b('comAplicar').onclick = ()=>{
    const v = String(S.com.metaPadrao||'').trim();
    if(!v) return toast('Digite a meta diária antes de aplicar.', true);
    funcionariosDaComissao().forEach(f=>{
      const m = S.com.metas[f.id] || (S.com.metas[f.id] = {funcionarioId:f.id});
      m.metaDiaria = moeda(valorNum(v));
    });
    desenhar();
    toast('Meta aplicada a todos os funcionários da lista.');
  };
  if(b('comSalvar')) b('comSalvar').onclick = salvarMetas;
  if(b('comExcel')) b('comExcel').onclick = exportarComissoesExcel;
  document.querySelectorAll('[data-batidas]').forEach(x=>
    x.onclick = ()=>abrirBatidas(x.dataset.batidas));

async function salvarMetas(){
  const lista = funcionariosDaComissao();
  const itens = lista.map(f=>({
    funcionarioId:f.id, nome:f.nome, filial:f.filial,
    metaDiaria: (S.com.metas[f.id]||{}).metaDiaria || ''
  })).filter(it=>it.metaDiaria);
  if(!itens.length) return toast('Nenhuma meta preenchida.', true);
  carregando(true);
  try{
    const r = await api('salvarMetas', {competencia:S.competencia, itens});
    toast(r.salvos+' metas salvas em '+compBonita(S.competencia)+'.');
  }catch(e){ toast(e.message, true); }
  finally{ carregando(false); }
}

function abrirBatidas(funcId){
  const f = S.funcionarios.find(x=>x.id===funcId);
  const meta = (S.com.metas[funcId]||{}).metaDiaria || '';
  const el = modal(`
    <div class="modal-topo">
      <div><small>Metas batidas · ${compBonita(S.competencia)}${meta?' · meta diária '+esc(meta):''}</small>
        <h2>${esc(f.nome)}</h2></div>
      <button class="fechar" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-corpo" id="batCorpo"></div>`);
  el._func = f;
  desenharBatidas(el);
  return el;
}

function desenharBatidas(el){
  const f = el._func;
  const lista = batidasDe(f.id);
  const primeiro = S.competencia+'-01';
  const ultimo = S.competencia+'-'+String(fimDoMes(S.competencia).getDate()).padStart(2,'0');

  el.querySelector('#batCorpo').innerHTML = `
    <div class="resumo-imp">
      <div><b style="color:var(--verde)">${lista.length}</b> dias batidos</div>
      <div><b>${moeda(totalBatidas(f.id))}</b> no mês</div>
    </div>
    <div class="barra" style="margin-bottom:14px">
      <div><label class="campo-lbl" for="batData">Data</label>
        <input class="entrada" type="date" id="batData" min="${primeiro}" max="${ultimo}" value="${ultimo}"></div>
      <div><label class="campo-lbl" for="batValor">Valor</label>
        <input class="entrada mono" id="batValor" placeholder="0,00" style="width:110px"></div>
      <div style="flex:1;min-width:160px"><label class="campo-lbl" for="batObs">Observação</label>
        <input class="entrada" id="batObs" placeholder="Opcional"></div>
      <button class="btn" id="batAdd" style="align-self:flex-end">Lançar</button>
    </div>
    ${lista.length ? `<div class="previa"><table><thead><tr>
      <th style="width:120px">Data</th><th style="width:120px">Valor</th><th>Observação</th>
      <th style="width:80px">Lançado por</th><th style="width:70px"></th>
    </tr></thead><tbody>
    ${lista.map(d=>`<tr>
      <td class="mono">${dataBonita(d.data)}</td>
      <td class="mono" style="text-align:right;font-weight:600">${moeda(valorNum(d.valor))}</td>
      <td style="color:var(--apagado)">${esc(d.observacao||'')}</td>
      <td style="color:var(--apagado);font-size:12px">${esc(d.lancadoPor||'')}</td>
      <td style="text-align:right"><button class="link-acao rem" data-bat-excluir="${esc(d.id)}">Excluir</button></td>
    </tr>`).join('')}
    </tbody></table></div>`
    : '<div class="vazio"><b>Nenhum dia lançado</b>Registre acima o primeiro dia em que a meta foi batida.</div>'}`;

  el.querySelector('#batAdd').onclick = async ()=>{
    const data = el.querySelector('#batData').value;
    const valor = el.querySelector('#batValor').value.trim();
    if(!data) return toast('Escolha a data.', true);
    if(data < primeiro || data > ultimo)
      return toast('A data precisa estar dentro de '+compBonita(S.competencia)+'.', true);
    if(batidasDe(f.id).some(d=>d.data===data))
      return toast('Já existe um lançamento nessa data.', true);
    carregando(true);
    try{
      const batida = {funcionarioId:f.id, data, valor: valor?moeda(valorNum(valor)):'',
                      observacao: el.querySelector('#batObs').value.trim()};
      const r = await api('salvarBatida', {competencia:S.competencia, batida});
      S.com.dias.push(Object.assign({id:r.id, competencia:S.competencia, lancadoPor:S.sessao.usuario}, batida));
      if(S.cont.competencia===S.competencia) S.cont.competencia = null;
      desenharBatidas(el); desenhar();
      toast('Meta de '+dataBonita(data)+' lançada.');
    }catch(e){ toast(e.message, true); }
    finally{ carregando(false); }
  };

  el.querySelectorAll('[data-bat-excluir]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Excluir este lançamento?')) return;
    carregando(true);
    try{
      await api('excluirBatida', {id:b.dataset.batExcluir});
      S.com.dias = S.com.dias.filter(d=>d.id!==b.dataset.batExcluir);
      if(S.cont.competencia===S.competencia) S.cont.competencia = null;
      desenharBatidas(el); desenhar();
      toast('Lançamento excluído.');
    }catch(e){ toast(e.message, true); }
    finally{ carregando(false); }
  });
}
